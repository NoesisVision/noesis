plugins {
    id 'application'
}

group = 'com.example'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':a')
    testImplementation 'io.cucumber:cucumber-java:7.34.9'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'com.example.b.App'
}
