// The Gradle counterpart of ../maven-plugin: the same engines (../core) behind a `noesisParse` task. It is a Gradle build
// of its own because the Gradle API is not published to Maven Central; it takes the core from the local Maven repository,
// so `mvn -q install -DskipTests` in .. comes first.
plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

// Kept equal to the version in ../pom.xml: the example and the service pin the plugin by it.
group = 'vision.noesis'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenLocal {
        content {
            includeGroup 'vision.noesis'
        }
    }
    mavenCentral()
}

// Every configuration resolves to the versions in gradle.lockfile; `./gradlew dependencies --write-locks` updates it.
dependencyLocking {
    lockAllConfigurations()
}

// Compiled for Gradle's minimum (17), like the core, on whatever JDK runs the build.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation "vision.noesis:noesis-parser-core:${version}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    plugins {
        noesisParser {
            id = 'vision.noesis.parser'
            implementationClass = 'vision.noesis.parser.gradle.NoesisParserPlugin'
            displayName = 'Noesis Parser'
            description = 'Parses the Java projects of the build into the Noesis code model (task: noesisParse)'
        }
    }
}

// The task reports the plugin version as the model's generator version.
tasks.named('processResources') {
    inputs.property('version', version)
    filesMatching('**/plugin.properties') {
        expand version: version
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // The functional test runs Gradle on a fixture build; it is where a compiled fixture and a resolved Guava come from.
    systemProperty 'noesis.fixturesDir', layout.projectDirectory.dir('src/test/resources').asFile.absolutePath
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
