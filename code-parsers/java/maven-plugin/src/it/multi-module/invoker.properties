# The exact invocation the service makes: compile the reactor and its tests, then parse every module with the plugin's full coordinates.
invoker.goals = -q process-test-classes vision.noesis:noesis-parser-maven-plugin:${project.version}:parse -Dnoesis.out=target/noesis -Dnoesis.repository=multi-module -Dnoesis.revision=0123456789abcdef
