# A repository's parse command on a reactor that does not fully compile: a compile error does not fail the build
# (maven.compiler.failOnError=false), so the module is parsed with the compiler's errors in its model, and the
# modules after it are parsed too.
invoker.goals = -q -Dmaven.compiler.failOnError=false process-classes vision.noesis:noesis-parser-maven-plugin:${project.version}:parse -Dnoesis.out=target/noesis -Dnoesis.repository=broken-reactor
