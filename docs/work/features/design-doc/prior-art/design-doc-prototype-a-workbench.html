<title>Design Doc Workbench</title>
<style>

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--foreground);
  background: var(--background);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
::selection { background: color-mix(in oklch, var(--primary) 22%, transparent); }

/* ---- inline editable fields ---- */
.field { display: inline-flex; align-items: baseline; gap: 4px; max-width: 100%; }
.ed {
  border-radius: 4px;
  padding: 1px 4px;
  margin: -1px -4px;
  outline: none;
  transition: background 90ms ease, box-shadow 90ms ease;
  white-space: pre-wrap;
  word-break: break-word;
}
.ed:hover:not(.is-locked) { background: color-mix(in oklch, var(--primary) 7%, transparent); }
.ed:focus {
  background: var(--card);
  box-shadow: 0 0 0 2px color-mix(in oklch, var(--ring) 45%, transparent);
}
.ed.is-empty::before {
  content: attr(data-placeholder);
  color: var(--muted-foreground);
  font-style: italic;
}
.ed.is-locked { background: color-mix(in oklch, var(--muted) 60%, transparent); cursor: default; }
.lock {
  border: 0;
  background: none;
  padding: 1px 2px;
  border-radius: 4px;
  color: var(--muted-foreground);
  opacity: 0;
  cursor: pointer;
  line-height: 0;
  transition: opacity 90ms ease;
}
.field:hover .lock, .lock.on { opacity: 1; }
.lock.on { color: var(--primary); }
.lock:hover { background: var(--accent); }
.sel {
  font: inherit;
  font-size: 12px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: inherit;
}
.sel:disabled { background: var(--muted); color: var(--muted-foreground); }

/* ---- change-set badges ---- */
.badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge.add { color: var(--add); background: var(--add-soft); border-color: color-mix(in oklch, var(--add) 25%, transparent); }
.badge.mod { color: var(--mod); background: var(--mod-soft); border-color: color-mix(in oklch, var(--mod) 25%, transparent); }
.badge.del { color: var(--del); background: var(--del-soft); border-color: color-mix(in oklch, var(--del) 25%, transparent); }

.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--muted-foreground); }


#app { display: flex; flex-direction: column; height: 100vh; }

/* ---- top bar ---- */
header.top {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  flex: none;
}
.doc-title { font-size: 15px; font-weight: 600; }
.top .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground);
  cursor: pointer;
}
.pill.on { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ---- three panes ---- */
main.split { flex: 1; display: grid; grid-template-columns: 268px minmax(0, 1fr) 520px; min-height: 0; }
aside.nav { border-right: 1px solid var(--border); background: var(--sidebar); overflow: auto; padding: 10px 8px 40px; }
section.doc { overflow: auto; padding: 24px 32px 80px; min-width: 0; }
aside.graph { border-left: 1px solid var(--border); background: var(--canvas); display: flex; flex-direction: column; min-width: 0; }

/* ---- nav tree ---- */
.search { width: 100%; font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); margin-bottom: 10px; }
.nav-row {
  display: flex; align-items: center; gap: 6px;

}
.nav-row:hover { background: var(--accent); }

.nav-row .name { overflow: hidden; text-overflow: ellipsis; }

.nav-row.lvl2 { padding-left: 26px; }
.nav-row.lvl3 { padding-left: 38px; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin: 12px 6px 4px; }
.tw { width: 12px; text-align: center; color: var(--muted-foreground); font-size: 10px; flex: none; }
.tag {
  font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.03em;
  padding: 1px 4px; border-radius: 4px; flex: none;
}

/* ---- document body ---- */
h1.doc-h { font-size: 26px; margin: 0 0 6px; font-weight: 650; letter-spacing: -0.01em; }
.crumbs { font-size: 12px; color: var(--muted-foreground); margin-bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.lede { font-size: 15px; line-height: 1.65; margin-bottom: 22px; max-width: 68ch; }
h2.sec {

h2.sec::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.card {

.card.added { border-left: 3px solid var(--add); }

.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-head .name { font-weight: 550; }
.card-desc { color: var(--muted-foreground); margin-top: 3px; max-width: 74ch; }
.kv { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: 13px; }
.kv .k { color: var(--muted-foreground); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; min-width: 74px; flex: none; }

.chip {

table.props th {

  color: var(--muted-foreground); font-weight: 500; padding: 0 8px 4px 0;

table.props td { padding: 5px 8px 5px 0; border-top: 1px solid var(--border); vertical-align: top; }
table.props tr.removed td { opacity: 0.55; text-decoration: line-through; }
.flagbtn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; font-size: 10px; padding: 0 6px; cursor: pointer; color: var(--muted-foreground); }
.flagbtn.on { background: var(--secondary); color: var(--foreground); border-color: var(--input); }
.gwt { display: grid; grid-template-columns: 52px 1fr; gap: 2px 8px; margin-top: 6px; font-size: 13px; }
.gwt .g { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); padding-top: 2px; }
details.beh > summary { list-style: none; cursor: pointer; }
details.beh > summary::-webkit-details-marker { display: none; }
details.beh[open] > summary { margin-bottom: 8px; }
.nest { border-left: 2px solid var(--border); padding-left: 12px; margin-top: 8px; }

/* ---- graph pane ---- */
.graph-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--card); }
.graph-head .t { font-size: 12px; font-weight: 600; }
.graph-scroll { flex: 1; overflow: auto; padding: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--card); }
.lg { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted-foreground); }
.lg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
svg .node-box { cursor: pointer; }
svg .node-box:hover rect.bg { filter: brightness(0.97); }
svg text { font-family: var(--font-sans); }
svg .nlabel { font-size: 11.5px; font-weight: 550; }
svg .ntype { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; }
svg .edge { fill: none; stroke: var(--border); stroke-width: 1.5; }
svg .dep { fill: none; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.75; }
svg .dep.uses { stroke: oklch(0.62 0.13 250); }
svg .dep.implements { stroke: oklch(0.62 0.12 300); }
svg .sel rect.bg { stroke-width: 2.5; }
</style>

const BLOCK_TYPES = [
  "aggregate", "entity", "value_object", "domain_event", "domain_command",
  "domain_query", "domain_service", "application_service", "repository",
  "factory", "external_integration",
];
const BEHAVIOUR_TYPES = ["Command", "Event", "Query"];
const RULE_TYPES = ["Consistency", "Structure", "Computation", "State change"];
const QA_TYPES = ["performance", "availability", "security", "other"];

// ---- change-set helpers ----------------------------------------------------
// A change set is { added, modified, removed }. Everywhere the prototypes need a
// plain list, items get a _change tag and removed names become ghost entries.
const EMPTY_CS = { added: [], modified: [], removed: [] };
function items(cs) {
  const c = cs || EMPTY_CS;
  // A StringChangeSet holds bare strings (behaviour input / output / used
  // blocks); everything else holds objects. Both come out as {name, ...}.
  const tag = (i, change) =>
    typeof i === "string" ? { name: i, _change: change } : { ...i, _change: change };
  return [
    ...(c.added || []).map((i) => tag(i, "added")),
    ...(c.modified || []).map((i) => tag(i, "modified")),
    ...(c.removed || []).map((name) => ({ name, _change: "removed" })),
  ];
}
function live(cs) {
  return items(cs).filter((i) => i._change !== "removed");
}
function csCount(cs) {
  const c = cs || EMPTY_CS;
  return (c.added || []).length + (c.modified || []).length + (c.removed || []).length;
}

// ---- flattened index over the doc -----------------------------------------
// Every building block, with the context/module it lives in. Blocks declared on
// a context directly have module === null.
function indexBlocks(doc) {
  const out = [];
  for (const ctx of live(doc.boundedContexts)) {
    for (const b of items(ctx.buildingBlocks)) {
      out.push({ block: b, context: ctx.name, module: null });
    }
    for (const mod of live(ctx.modules)) {
      for (const b of items(mod.buildingBlocks)) {
        out.push({ block: b, context: ctx.name, module: mod.name });
      }
    }
  }
  return out;
}

// Use cases. A use case is a public behaviour of an application service — the
// system's entry points. Public behaviours on aggregates or domain services are
// still behaviours, but they are not use cases.
function useCases(doc) {
  const out = [];
  for (const { block, context, module } of indexBlocks(doc)) {
    if (block.type !== "application_service" || block._change === "removed") continue;
    for (const beh of live(block.behaviours)) {
      if (beh.isPublic) out.push({ behaviour: beh, block, context, module });
    }
  }
  return out;
}
function useCaseCount(block) {
  if (!block || block.type !== "application_service") return 0;
  return live(block.behaviours).filter((b) => b.isPublic).length;
}
// Use cases grouped by actor, unattributed ones last.
function useCasesByActor(doc) {
  const groups = new Map();
  for (const uc of useCases(doc)) {
    const key = uc.behaviour.actor || "Unassigned";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(uc);
  }
  const known = doc.actors.map((a) => a.name).filter((n) => groups.has(n));
  const rest = [...groups.keys()].filter((k) => !known.includes(k));
  return [...known, ...rest].map((actor) => ({ actor, cases: groups.get(actor) }));
}

// Edges between building blocks: `implements` plus every behaviour's
// usedBuildingBlocks. Only edges whose both ends exist in the doc are kept.
function blockEdges(doc) {
  const index = indexBlocks(doc);
  const known = new Set(index.map((e) => e.block.name));
  const edges = [];
  const seen = new Set();
  const push = (from, to, kind) => {
    if (!known.has(to) || from === to) return;
    const key = `${from}|${to}|${kind}`;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from, to, kind });
  };
  for (const { block } of index) {
    for (const target of block.implements || []) push(block.name, target, "implements");
    for (const beh of live(block.behaviours)) {
      for (const target of live(beh.usedBuildingBlocks).map((i) => i.name || i)) {
        push(block.name, target, "uses");
      }
    }
  }
  return edges;
}

const TYPE_LABEL = {
  aggregate: "Aggregate", entity: "Entity", value_object: "Value object",
  domain_event: "Domain event", domain_command: "Domain command",
  domain_query: "Domain query", domain_service: "Domain service",
  application_service: "Application service", repository: "Repository",
  factory: "Factory", external_integration: "External integration",
};
const TYPE_SHORT = {
  aggregate: "AGG", entity: "ENT", value_object: "VO", domain_event: "EVT",
  domain_command: "CMD", domain_query: "QRY", domain_service: "DS",
  application_service: "AS", repository: "REPO", factory: "FAC",
  external_integration: "EXT",
};
// Hue per block type. Kept as an oklch triple so light and dark themes can
// derive fill / border / text from the same anchor.
const TYPE_HUE = {
  aggregate: 39, entity: 150, value_object: 250, domain_event: 300,
  domain_command: 20, domain_query: 200, domain_service: 100,
  application_service: 70, repository: 330, factory: 175, external_integration: 15,
};
function typeColor(type, kind) {
  const h = TYPE_HUE[type] ?? 90;
  if (kind === "fill") return `oklch(0.94 0.045 ${h})`;
  if (kind === "stroke") return `oklch(0.66 0.13 ${h})`;
  return `oklch(0.42 0.11 ${h})`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

<script>
// ---- live-object registry --------------------------------------------------
// Editors bind to the real objects inside DOC, so an edit mutates the document
// in place and any other view re-reads the new value on its next render.
const REFS = [];
function ref(obj) {
  const i = REFS.indexOf(obj);
  return i === -1 ? REFS.push(obj) - 1 : i;
}
function deref(id) {
  return REFS[Number(id)];
}

// ---- editable primitives ---------------------------------------------------
// `editable` renders one field of one object. `lock` mirrors the *_locked flags
// from the schema: a locked field is protected from further AI rewrites, so it
// renders read-only with the lock lit.
function editable(obj, key, opts = {}) {
  const lockKey = opts.lockKey === null ? null : opts.lockKey || `${key}_locked`;
  const locked = lockKey ? !!obj[lockKey] : false;
  const value = obj[key];
  const empty = value === null || value === undefined || value === "";
  const cls = ["ed", opts.class || "", empty ? "is-empty" : "", locked ? "is-locked" : ""].join(" ");
  const text = empty ? "" : esc(value);
  const lockBtn = lockKey
    ? `<button class="lock${locked ? " on" : ""}" data-lock="${ref(obj)}" data-key="${lockKey}" title="${locked ? "Locked — AI will not rewrite this" : "Unlocked — AI may rewrite this"}">${locked ? LOCK_ON : LOCK_OFF}</button>`
    : "";
  return `<span class="field"><span class="${cls}" contenteditable="${locked ? "false" : "plaintext-only"}" data-ref="${ref(obj)}" data-key="${key}" data-placeholder="${esc(opts.placeholder || "empty")}">${text}</span>${lockBtn}</span>`;
}

function enumSelect(obj, key, options, opts = {}) {
  const lockKey = opts.lockKey === null ? null : opts.lockKey || `${key}_locked`;
  const locked = lockKey ? !!obj[lockKey] : false;
  const current = obj[key];
  const opts_ = [`<option value=""${current ? "" : " selected"}>—</option>`]
    .concat(options.map((o) => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(opts.label ? opts.label(o) : o)}</option>`))
    .join("");
  const lockBtn = lockKey
    ? `<button class="lock${locked ? " on" : ""}" data-lock="${ref(obj)}" data-key="${lockKey}">${locked ? LOCK_ON : LOCK_OFF}</button>`
    : "";
  return `<span class="field"><select class="sel" data-ref="${ref(obj)}" data-key="${key}"${locked ? " disabled" : ""}>${opts_}</select>${lockBtn}</span>`;
}

const LOCK_ON = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg>`;
const LOCK_OFF = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 1 3.5 3.5.75.75 0 0 1-1.5 0 2 2 0 1 0-4 0V6H12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h.5V4.5A3.5 3.5 0 0 1 8 1Z"/></svg>`;

// Wires every editor inside `root`. `onChange(kind)` fires after a value lands,
// so a view can re-render the parts that depend on it (graph labels, counters).
function bindEditors(root, onChange) {
  root.addEventListener("input", (e) => {
    const el = e.target.closest("[data-ref][contenteditable]");
    if (!el) return;
    const obj = deref(el.dataset.ref);
    const text = el.textContent.trim();
    obj[el.dataset.key] = text === "" ? null : text;
    el.classList.toggle("is-empty", text === "");
    onChange && onChange("text", obj, el.dataset.key);
  });
  root.addEventListener("change", (e) => {
    const el = e.target.closest("select[data-ref]");
    if (!el) return;
    const obj = deref(el.dataset.ref);
    obj[el.dataset.key] = el.value === "" ? null : el.value;
    onChange && onChange("select", obj, el.dataset.key);
  });
  root.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-lock]");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const obj = deref(btn.dataset.lock);
    obj[btn.dataset.key] = !obj[btn.dataset.key];
    onChange && onChange("lock", obj, btn.dataset.key);
  });
  // Enter commits instead of inserting a newline in single-line fields.
  root.addEventListener("keydown", (e) => {
    const el = e.target.closest('[data-ref][contenteditable]:not(.multiline)');
    if (el && e.key === "Enter") {
      e.preventDefault();
      el.blur();
    }
  });
}

// ---- tidy left-to-right tree layout ---------------------------------------
// Nodes are {id, label, children}. Leaves take the next free row, a parent is
// centred on its children. Enough for a design doc's shallow containment tree.
function layoutTree(root, opts = {}) {
  const nodeW = opts.nodeW || 168;
  const nodeH = opts.nodeH || 40;
  const gapX = opts.gapX || 64;
  const gapY = opts.gapY || 14;
  const rowH = nodeH + gapY;
  const placed = [];
  let row = 0;
  function walk(node, depth) {
    const kids = node.children || [];
    let y;
    if (kids.length === 0) {
      y = row * rowH;
      row += 1;
    } else {
      const ys = kids.map((k) => walk(k, depth + 1));
      y = (ys[0] + ys[ys.length - 1]) / 2;
    }
    placed.push({ node, depth, x: depth * (nodeW + gapX), y, w: nodeW, h: nodeH });
    return y;
  }
  walk(root, 0);
  const maxDepth = Math.max(...placed.map((p) => p.depth));
  return {
    nodes: placed,
    width: (maxDepth + 1) * nodeW + maxDepth * gapX,
    height: Math.max(row, 1) * rowH,
    nodeW, nodeH,
  };
}

// Bezier from the right edge of `a` to the left edge of `b`.
function elbow(a, b) {
  const x1 = a.x + a.w;
  const y1 = a.y + a.h / 2;
  const x2 = b.x;
  const y2 = b.y + b.h / 2;
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

// Arc between two arbitrary boxes, used for dependency edges that skip levels.
function arc(a, b) {
  const ax = a.x + a.w / 2;
  const ay = a.y + a.h / 2;
  const bx = b.x + b.w / 2;
  const by = b.y + b.h / 2;
  const dx = bx - ax;
  const dy = by - ay;
  const bow = Math.min(120, Math.hypot(dx, dy) * 0.35);
  const mx = (ax + bx) / 2 - (dy / (Math.hypot(dx, dy) || 1)) * bow;
  const my = (ay + by) / 2 + (dx / (Math.hypot(dx, dy) || 1)) * bow;
  return `M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`;
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

function changeBadge(change) {
  if (change === "added") return `<span class="badge add">added</span>`;
  if (change === "modified") return `<span class="badge mod">changed</span>`;
  if (change === "removed") return `<span class="badge del">removed</span>`;
  return "";
}

<script>
// ---------------------------------------------------------------------------
// Prototype A — split workbench.
// Left: containment tree. Middle: the editable document for whatever is
// selected. Right: a graph of the selected context's building blocks.
// ---------------------------------------------------------------------------

let sel = { kind: "block", ctx: "Catalog", mod: "Product Definition", block: "Product" };
let showDiff = true;
let showDeps = true;
let filter = "";

const $ = (id) => document.getElementById(id);

// ---- lookups ----
const ctxByName = (n) => live(DOC.boundedContexts).find((c) => c.name === n);
const modByName = (c, n) => (c ? live(c.modules).find((m) => m.name === n) : null);
function blockByName(name) {
  return indexBlocks(DOC).find((e) => e.block.name === name);
}
function currentCtx() { return ctxByName(sel.ctx); }

function selectBlock(name) {
  const e = blockByName(name);
  if (!e) return;
  sel = { kind: "block", ctx: e.context, mod: e.module, block: name };
  render();
}

// ---- nav -------------------------------------------------------------------
function typeTag(type) {
  if (!type) return "";
  return `<span class="tag" style="background:${typeColor(type, "fill")};color:${typeColor(type, "text")}">${TYPE_SHORT[type] || "?"}</span>`;
}
function matches(name) {
  return !filter || name.toLowerCase().includes(filter);
}
function navRow(label, level, isSel, extra, onclickAttr, change) {
  const gone = change === "removed";
  return `<div class="nav-row lvl${level}${isSel ? " sel" : ""}" ${onclickAttr}${gone ? ' style="opacity:.5"' : ""}><span class="name"${gone ? ' style="text-decoration:line-through"' : ""}>${esc(label)}</span><span style="flex:1"></span>${extra || ""}</div>`;
}
function renderNav() {
  let h = `<input class="search" id="search" placeholder="Filter building blocks…" value="${esc(filter)}">`;
  h += navRow(DOC.name, 0, sel.kind === "doc", `<span class="muted" style="font-size:11px">doc</span>`, `data-sel='{"kind":"doc"}'`);
  // Use cases first: they are the entry points into the system, so they are the
  // fastest way into the behaviours that carry the scenarios.
  const ucs = useCases(DOC);
  h += `<div class="nav-group">Use cases <span style="text-transform:none">(${ucs.length})</span></div>`;
  h += navRow("All use cases", 1, sel.kind === "usecases", "", `data-sel='{"kind":"usecases"}'`);
  for (const uc of ucs) {
    if (!matches(uc.behaviour.name) && !matches(uc.behaviour.actor || "")) continue;
    h += navRow(uc.behaviour.name, 2, sel.kind === "usecase" && sel.uc === uc.behaviour.name,
      `<span class="muted" style="font-size:10px">${esc(uc.behaviour.actor || "—")}</span>`,
      `data-sel='${JSON.stringify({ kind: "usecase", ctx: uc.context, mod: uc.module, block: uc.block.name, uc: uc.behaviour.name })}'`);
  }
  h += `<div class="nav-group">Bounded contexts</div>`;
  for (const ctx of live(DOC.boundedContexts)) {
    const ctxSel = sel.ctx === ctx.name && sel.kind === "context";
    h += navRow(ctx.name, 1, ctxSel, showDiff ? changeBadge(ctx._change) : "", `data-sel='${JSON.stringify({ kind: "context", ctx: ctx.name })}'`);
    for (const b of items(ctx.buildingBlocks)) {
      if (!matches(b.name)) continue;
      h += navRow(b.name, 2, sel.kind === "block" && sel.block === b.name, typeTag(b.type), `data-sel='${JSON.stringify({ kind: "block", ctx: ctx.name, mod: null, block: b.name })}'`, b._change);
    }
    for (const mod of live(ctx.modules)) {
      const kids = items(mod.buildingBlocks).filter((b) => matches(b.name));
      if (filter && kids.length === 0) continue;
      h += navRow(mod.name, 2, sel.kind === "module" && sel.mod === mod.name, `<span class="muted" style="font-size:10px">${csCount(mod.buildingBlocks)}</span>`, `data-sel='${JSON.stringify({ kind: "module", ctx: ctx.name, mod: mod.name })}'`);
      for (const b of kids) {
        h += navRow(b.name, 3, sel.kind === "block" && sel.block === b.name, typeTag(b.type), `data-sel='${JSON.stringify({ kind: "block", ctx: ctx.name, mod: mod.name, block: b.name })}'`, b._change);
      }
    }
  }
  h += `<div class="nav-group">Actors</div>`;
  for (const a of DOC.actors) h += navRow(a.name, 1, false, "", `data-sel='{"kind":"doc"}'`);

}

// ---- shared section renderers ---------------------------------------------
function badgeOf(item) {
  return showDiff ? changeBadge(item._change) : "";
}

function propertiesSection(host, cs) {
  const list = items(cs);
  let h = `<h2 class="sec">Properties <span class="muted" style="text-transform:none;letter-spacing:0">${list.length}</span></h2>`;
  h += `<table class="props"><tr><th style="width:22%">Name</th><th style="width:22%">Type</th><th>Description</th><th style="width:90px"></th></tr>`;
  for (const p of list) {
    if (p._change === "removed") {
      h += `<tr class="removed"><td>${esc(p.name)}</td><td colspan="2"></td><td>${badgeOf(p)}</td></tr>`;
      continue;
    }
    h += `<tr>
      <td>${editable(p, "name")}</td>
      <td class="mono">${editable(p, "type", { placeholder: "type" })}</td>
      <td class="muted">${editable(p, "description", { placeholder: "describe this property", class: "multiline" })}</td>
      <td>
        <button class="flagbtn${p.nullable ? " on" : ""}" data-flag="${ref(p)}" data-key="nullable">null</button>
        <button class="flagbtn${p.collection ? " on" : ""}" data-flag="${ref(p)}" data-key="collection">list</button>

      </td></tr>`;
  }
  h += `</table><div style="margin-top:8px"><button class="addbtn" data-add="property" data-host="${ref(host)}">+ property</button></div>`;
  return h;
}

function rulesSection(host, cs, heading = "Rules") {
  const list = items(cs);
  let h = `<h2 class="sec">${heading} <span class="muted" style="text-transform:none;letter-spacing:0">${list.length}</span></h2>`;
  for (const r of list) {
    if (r._change === "removed") { h += `<div class="card removed"><span class="name">${esc(r.name)}</span> ${badgeOf(r)}</div>`; continue; }
    h += `<div class="card ${showDiff ? r._change : ""}">
      <div class="card-head"><span class="name">${editable(r, "name")}</span>

}

function scenariosSection(host, cs) {
  const list = items(cs);
  let h = `<h2 class="sec">Scenarios <span class="muted" style="text-transform:none;letter-spacing:0">${list.length}</span></h2>`;
  for (const s of list) {
    if (s._change === "removed") { h += `<div class="card removed"><span class="name">${esc(s.name)}</span> ${badgeOf(s)}</div>`; continue; }
    h += `<div class="card ${showDiff ? s._change : ""}">
      <div class="card-head"><span class="name">${editable(s, "name")}</span><span style="flex:1"></span>${badgeOf(s)}</div>
      <div class="card-desc">${editable(s, "description", { placeholder: "what this scenario shows", class: "multiline" })}</div>

        <span class="g">When</span><span>${editable(s, "when", { class: "multiline", placeholder: "action" })}</span>
        <span class="g">Then</span><span>${editable(s, "then", { class: "multiline", placeholder: "outcome" })}</span>
      </div>
    </div>`;
  }
  h += `<button class="addbtn" data-add="scenario" data-host="${ref(host)}">+ scenario</button>`;
  return h;
}

function qaSection(host, cs) {
  const list = items(cs);
  let h = `<h2 class="sec">Quality attributes <span class="muted" style="text-transform:none;letter-spacing:0">${list.length}</span></h2>`;
  for (const q of list) {
    if (q._change === "removed") { h += `<div class="card removed"><span class="name">${esc(q.name)}</span> ${badgeOf(q)}</div>`; continue; }
    h += `<div class="card ${showDiff ? q._change : ""}">
      <div class="card-head"><span class="name">${editable(q, "name")}</span>
        ${enumSelect(q, "type", QA_TYPES, { lockKey: null })}
        <span style="flex:1"></span>${badgeOf(q)}</div>

function chipList(cs, linkable) {
  const list = items(cs);
  if (list.length === 0) return `<span class="muted">—</span>`;
  return `<span class="chips">${list.map((i) => {

function behaviourCard(b, onAppService) {
  if (b._change === "removed") return `<div class="card removed"><span class="name">${esc(b.name)}</span> ${badgeOf(b)}</div>`;
  const ruleN = csCount(b.rules), scnN = csCount(b.scenarios), qaN = csCount(b.qualityAttributes);
  const isUseCase = onAppService && b.isPublic;

    <summary>
      <div class="card-head">
        <span class="name">${editable(b, "name")}</span>
        ${isUseCase ? `<span class="badge add" style="color:var(--primary);background:color-mix(in oklch, var(--primary) 12%, transparent);border-color:color-mix(in oklch, var(--primary) 30%, transparent)">use case</span>` : ""}
        ${enumSelect(b, "type", BEHAVIOUR_TYPES)}

        <span style="flex:1"></span>

    <div class="nest">

      <div class="kv"><span class="k">Input</span>${chipList(b.input)}</div>
      <div class="kv"><span class="k">Output</span>${chipList(b.output)}</div>
      <div class="kv"><span class="k">Uses</span>${chipList(b.usedBuildingBlocks, true)}</div>
      ${rulesSection(b, b.rules)}
      ${scenariosSection(b, b.scenarios)}
      ${qaN ? qaSection(b, b.qualityAttributes) : ""}

  </details>`;
}

// ---- use cases -------------------------------------------------------------
// A use case is a public behaviour of an application service. Its rules and
// Gherkin scenarios are shown expanded — that is the point of the view.
function useCaseDetail(uc) {
  const b = uc.behaviour;
  let h = `<div class="crumbs"><span>${esc(uc.context)}</span>${uc.module ? `›<span>${esc(uc.module)}</span>` : ""}›<span>${esc(uc.block.name)}</span>›<span>use case</span></div>`;
  h += `<h1 class="doc-h">${editable(b, "name")} ${badgeOf(b)}</h1>`;
  h += `<div class="kv"><span class="k">Actor</span>${editable(b, "actor", { placeholder: "no actor" })}
    <span class="k" style="margin-left:12px">Kind</span>${enumSelect(b, "type", BEHAVIOUR_TYPES)}
    <span class="k" style="margin-left:12px">Service</span><span class="chip link" data-goto="${esc(uc.block.name)}">${esc(uc.block.name)}</span></div>`;
  h += `<div class="lede">${editable(b, "description", { class: "multiline", placeholder: "what the actor achieves" })}</div>`;
  h += `<div class="kv"><span class="k">Input</span>${chipList(b.input)}</div>`;
  h += `<div class="kv"><span class="k">Output</span>${chipList(b.output)}</div>`;
  h += `<div class="kv"><span class="k">Uses</span>${chipList(b.usedBuildingBlocks, true)}</div>`;
  h += rulesSection(b, b.rules);
  h += scenariosSection(b, b.scenarios);
  h += qaSection(b, b.qualityAttributes);
  return h;
}

function useCaseOverview() {
  const groups = useCasesByActor(DOC);
  let h = `<h1 class="doc-h">Use cases</h1>
    <div class="crumbs"><span>${useCases(DOC).length} public behaviours on application services</span></div>
    <div class="lede">Every way an actor drives this system. Each one carries its own rules and Gherkin scenarios; open one to edit them.</div>`;
  for (const g of groups) {
    h += `<h2 class="sec">${esc(g.actor)} <span class="muted" style="text-transform:none;letter-spacing:0">${g.cases.length}</span></h2>`;
    for (const uc of g.cases) {
      const b = uc.behaviour;
      const scn = items(b.scenarios).filter((s) => s._change !== "removed");
      h += `<div class="card ${showDiff ? b._change : ""}" style="cursor:pointer" data-sel='${JSON.stringify({ kind: "usecase", ctx: uc.context, mod: uc.module, block: uc.block.name, uc: b.name })}'>
        <div class="card-head"><span class="name">${esc(b.name)}</span><span class="chip">${esc(b.type || "—")}</span>
          <span class="muted" style="font-size:11px">${esc(uc.block.name)} · ${esc(uc.context)}</span>
          <span style="flex:1"></span><span class="muted" style="font-size:11px">${plural(csCount(b.rules), "rule")} · ${plural(scn.length, "scenario")}</span>${badgeOf(b)}</div>
        <div class="card-desc">${esc(b.description || "")}</div>
        ${scn.length ? `<div class="gwt">${scn.map((s) => `<span class="g">Then</span><span class="muted">${esc(s.then)}</span>`).join("")}</div>` : ""}
      </div>`;
    }
  }
  return h;
}

// ---- document pane ---------------------------------------------------------
function renderDoc() {
  let h = "";
  if (sel.kind === "usecases") {
    $("docPane").innerHTML = useCaseOverview();
    return;
  }
  if (sel.kind === "usecase") {
    const uc = useCases(DOC).find((u) => u.behaviour.name === sel.uc && u.block.name === sel.block);
    $("docPane").innerHTML = uc ? useCaseDetail(uc) : `<p class="muted">Use case gone.</p>`;
    return;
  }
  if (sel.kind === "doc") {
    h += `<h1 class="doc-h">${editable(DOC, "name")}</h1>`;
    h += `<div class="crumbs"><span>${esc(DOC.id)}</span>·<span>${esc(DOC.date)}</span>·<span>${live(DOC.boundedContexts).length} bounded contexts</span>·<span>${indexBlocks(DOC).length} building blocks</span></div>`;
    h += `<div class="lede">${editable(DOC, "description", { class: "multiline" })}</div>`;
    h += `<h2 class="sec">Actors</h2>`;
    for (const a of DOC.actors) {
      h += `<div class="card"><div class="card-head"><span class="name">${editable(a, "name")}</span></div>
        <div class="card-desc">${editable(a, "description", { placeholder: "who they are", class: "multiline" })}</div></div>`;
    }
    h += `<button class="addbtn" data-add="actor">+ actor</button>`;
    h += `<h2 class="sec">Use cases <span class="muted" style="text-transform:none;letter-spacing:0">${useCases(DOC).length}</span></h2>`;
    for (const g of useCasesByActor(DOC)) {
      h += `<div class="card" style="cursor:pointer" data-open='{"kind":"usecases"}'>
        <div class="card-head"><span class="name">${esc(g.actor)}</span><span style="flex:1"></span><span class="muted" style="font-size:11px">${g.cases.length} use cases</span></div>
        <div class="card-desc">${g.cases.map((uc) => esc(uc.behaviour.name)).join(" · ")}</div></div>`;
    }
    h += `<h2 class="sec">Bounded contexts</h2>`;
    for (const c of live(DOC.boundedContexts)) {
      h += `<div class="card ${showDiff ? c._change : ""}" data-open='${JSON.stringify({ kind: "context", ctx: c.name })}' style="cursor:pointer">
        <div class="card-head"><span class="name">${esc(c.name)}</span>${badgeOf(c)}<span style="flex:1"></span>
          <span class="muted" style="font-size:11px">${live(c.modules).length} modules · ${items(c.buildingBlocks).length + live(c.modules).reduce((n, m) => n + items(m.buildingBlocks).length, 0)} blocks</span></div>
        <div class="card-desc">${esc(c.description || "")}</div></div>`;
    }
  } else if (sel.kind === "context" || sel.kind === "module") {
    const ctx = currentCtx();
    const node = sel.kind === "module" ? modByName(ctx, sel.mod) : ctx;
    if (!node) return;
    h += `<div class="crumbs"><span>${esc(DOC.name)}</span>›<span>${esc(ctx.name)}</span>${sel.kind === "module" ? `›<span>${esc(node.name)}</span>` : ""}</div>`;
    h += `<h1 class="doc-h">${editable(node, "name")} ${badgeOf(node)}</h1>`;
    h += `<div class="lede">${editable(node, "description", { placeholder: "what this owns", class: "multiline" })}</div>`;
    if (sel.kind === "context" && live(ctx.modules).length) {
      h += `<h2 class="sec">Modules</h2>`;
      for (const m of live(ctx.modules)) {
        h += `<div class="card ${showDiff ? m._change : ""}" data-open='${JSON.stringify({ kind: "module", ctx: ctx.name, mod: m.name })}' style="cursor:pointer">
          <div class="card-head"><span class="name">${esc(m.name)}</span>${badgeOf(m)}<span style="flex:1"></span><span class="muted" style="font-size:11px">${items(m.buildingBlocks).length} blocks</span></div>
          <div class="card-desc">${esc(m.description || "")}</div></div>`;
      }
    }
    h += `<h2 class="sec">Building blocks</h2>`;
    for (const b of items(node.buildingBlocks)) {
      if (b._change === "removed") { h += `<div class="card removed"><span class="name">${esc(b.name)}</span> ${badgeOf(b)}</div>`; continue; }
      h += `<div class="card ${showDiff ? b._change : ""}" data-goto="${esc(b.name)}" style="cursor:pointer">
        <div class="card-head">${typeTag(b.type)}<span class="name">${esc(b.name)}</span>${badgeOf(b)}<span style="flex:1"></span>
          <span class="muted" style="font-size:11px">${csCount(b.properties)} props · ${csCount(b.behaviours)} behaviours · ${csCount(b.rules)} rules</span></div>
        <div class="card-desc">${esc(b.description || "")}</div></div>`;
    }
    h += `<button class="addbtn" data-add="block" data-host="${ref(node)}">+ building block</button>`;
    h += qaSection(node, node.qualityAttributes);
  } else {
    const entry = blockByName(sel.block);
    if (!entry) { $("docPane").innerHTML = `<p class="muted">Nothing selected.</p>`; return; }
    const b = entry.block;
    h += `<div class="crumbs"><span>${esc(entry.context)}</span>${entry.module ? `›<span>${esc(entry.module)}</span>` : ""}›<span>${esc(b.name)}</span></div>`;
    h += `<h1 class="doc-h">${editable(b, "name")} ${badgeOf(b)}</h1>`;
    h += `<div class="kv" style="margin-bottom:10px"><span class="k">Type</span>${enumSelect(b, "type", BLOCK_TYPES, { label: (t) => TYPE_LABEL[t] })}
      <span class="k" style="margin-left:12px">Implements</span>${chipList({ added: (b.implements || []).map((n) => ({ name: n })) }, true)}</div>`;
    h += `<div class="lede">${editable(b, "description", { placeholder: "what this block is responsible for", class: "multiline" })}</div>`;
    h += propertiesSection(b, b.properties);
    h += `<h2 class="sec">Behaviours <span class="muted" style="text-transform:none;letter-spacing:0">${csCount(b.behaviours)}</span></h2>`;
    for (const beh of items(b.behaviours)) h += behaviourCard(beh, b.type === "application_service");
    h += `<button class="addbtn" data-add="behaviour" data-host="${ref(b)}">+ behaviour</button>`;
    h += rulesSection(b, b.rules, "Invariants");
    h += scenariosSection(b, b.scenarios);
    h += qaSection(b, b.qualityAttributes);
  }
  $("docPane").innerHTML = h;
}

// ---- graph pane ------------------------------------------------------------
// The graph shows containment (context › module › block) as a tidy tree, with
// implements / uses relations overlaid as dashed arcs.
function renderGraph() {
  const ctx = sel.kind === "doc" ? null : currentCtx();
  const scope = ctx ? [ctx] : live(DOC.boundedContexts);
  const root = {
    id: ctx ? `ctx:${ctx.name}` : "doc",
    label: ctx ? ctx.name : DOC.name,
    kind: ctx ? "context" : "doc",
    children: [],
  };
  const boxOf = new Map();
  for (const c of scope) {
    const cNode = ctx ? root : { id: `ctx:${c.name}`, label: c.name, kind: "context", children: [] };
    if (!ctx) root.children.push(cNode);
    for (const b of live(c.buildingBlocks)) cNode.children.push({ id: `b:${b.name}`, label: b.name, kind: "block", block: b, children: [] });
    for (const m of live(c.modules)) {
      const mNode = { id: `m:${m.name}`, label: m.name, kind: "module", children: [] };
      cNode.children.push(mNode);
      for (const b of live(m.buildingBlocks)) mNode.children.push({ id: `b:${b.name}`, label: b.name, kind: "block", block: b, children: [] });
    }
  }
  const laid = layoutTree(root, { nodeW: 140, nodeH: 38, gapX: 28, gapY: 12 });
  for (const p of laid.nodes) boxOf.set(p.node.id, p);

  const pad = 12;
  const W = laid.width + pad * 2;
  const H = laid.height + pad * 2;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs>
      <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/>
      </marker>
    </defs><g transform="translate(${pad},${pad})">`;

  // containment edges
  const walk = (n) => {
    for (const k of n.children || []) {
      svg += `<path class="edge" d="${elbow(boxOf.get(n.id), boxOf.get(k.id))}"/>`;
      walk(k);
    }
  };
  walk(root);

  // dependency arcs between visible blocks
  if (showDeps) {
    for (const e of blockEdges(DOC)) {
      const a = boxOf.get(`b:${e.from}`), b = boxOf.get(`b:${e.to}`);
      if (!a || !b) continue;
      svg += `<path class="dep ${e.kind}" marker-end="url(#ar)" d="${arc(a, b)}"/>`;
    }
  }

  for (const p of laid.nodes) {
    const n = p.node;
    const isSel = (n.kind === "block" && (sel.kind === "block" || sel.kind === "usecase") && sel.block === n.label) ||
      (n.kind === "context" && sel.kind === "context" && sel.ctx === n.label) ||
      (n.kind === "module" && sel.kind === "module" && sel.mod === n.label);
    let fill = "var(--card)", stroke = "var(--border)", text = "var(--foreground)", sub = "";
    if (n.kind === "block") {
      fill = typeColor(n.block.type, "fill");
      stroke = typeColor(n.block.type, "stroke");
      text = typeColor(n.block.type, "text");
      sub = TYPE_LABEL[n.block.type] || "";
    } else if (n.kind === "context") {
      fill = "var(--secondary)"; stroke = "var(--input)"; sub = "bounded context";
    } else if (n.kind === "module") {
      fill = "var(--card)"; stroke = "var(--input)"; sub = "module";
    }
    const label = n.label.length > 17 ? n.label.slice(0, 16) + "…" : n.label;
    svg += `<g class="node-box${isSel ? " sel" : ""}" transform="translate(${p.x},${p.y})" data-node="${esc(n.kind)}:${esc(n.label)}">
      <rect class="bg" width="${p.w}" height="${p.h}" rx="8" fill="${fill}" stroke="${isSel ? "var(--primary)" : stroke}"/>
      <text class="nlabel" x="10" y="${sub ? 17 : 24}" fill="${text}">${esc(label)}</text>
      ${sub ? `<text class="ntype" x="10" y="30" fill="${text}" opacity="0.72">${esc(sub)}</text>` : ""}
      ${n.kind === "block" && useCaseCount(n.block) ? `<g transform="translate(${p.w - 26},6)">
        <rect width="20" height="14" rx="7" fill="var(--primary)"/>
        <text x="10" y="10.5" text-anchor="middle" font-size="9" font-weight="600" fill="var(--primary-foreground)">${useCaseCount(n.block)}</text></g>` : ""}
    </g>`;
  }
  svg += `</g></svg>`;
  $("graphScroll").innerHTML = svg;
  $("graphTitle").textContent = ctx ? `${ctx.name} — building blocks` : "All bounded contexts";
  $("graphMeta").textContent = `${laid.nodes.filter((p) => p.node.kind === "block").length} blocks`;

  const usedTypes = [...new Set(indexBlocks(DOC).map((e) => e.block.type).filter(Boolean))];
  $("legend").innerHTML = usedTypes.map((t) => `<span class="lg"><i style="background:${typeColor(t, "fill")};outline:1px solid ${typeColor(t, "stroke")}"></i>${TYPE_LABEL[t]}</span>`).join("") +
    `<span class="lg"><i style="background:oklch(0.62 0.13 250)"></i>uses</span><span class="lg"><i style="background:oklch(0.62 0.12 300)"></i>implements</span>`;
}

// ---- render + events -------------------------------------------------------
function render() {
  $("topTitle").textContent = DOC.name;
  $("topDate").textContent = DOC.date;
  $("tImpl").classList.toggle("on", DOC.implemented);
  $("tImpl").lastElementChild.textContent = DOC.implemented ? "implemented" : "not implemented";
  $("tDiff").classList.toggle("on", showDiff);
  $("tDeps").classList.toggle("on", showDeps);
  renderNav();
  renderDoc();
  renderGraph();
}

const app = $("app");
bindEditors(app, (kind) => {
  // Names feed the nav and the graph, so a text edit re-renders everything but
  // the field being typed in; locks and selects are cheap enough to re-render.
  if (kind === "text") { renderNav(); renderGraph(); $("topTitle").textContent = DOC.name; }
  else render();
});

app.addEventListener("click", (e) => {
  const navSel = e.target.closest("[data-sel]");
  if (navSel) { sel = { ...sel, ...JSON.parse(navSel.dataset.sel) }; render(); return; }
  const open = e.target.closest("[data-open]");
  if (open) { sel = { ...sel, ...JSON.parse(open.dataset.open) }; render(); return; }
  const goto = e.target.closest("[data-goto]");
  if (goto) { selectBlock(goto.dataset.goto); return; }
  const node = e.target.closest("[data-node]");
  if (node) {
    const [kind, name] = node.dataset.node.split(/:(.*)/s);
    if (kind === "block") selectBlock(name);
    else if (kind === "context") { sel = { kind: "context", ctx: name, mod: null, block: null }; render(); }
    else if (kind === "module") { sel = { ...sel, kind: "module", mod: name }; render(); }
    return;
  }
  const flag = e.target.closest("[data-flag]");
  if (flag) { const o = deref(flag.dataset.flag); o[flag.dataset.key] = !o[flag.dataset.key]; render(); return; }
  const add = e.target.closest("[data-add]");
  if (add) { addItem(add.dataset.add, add.dataset.host ? deref(add.dataset.host) : null); return; }
});

$("tImpl").addEventListener("click", () => { DOC.implemented = !DOC.implemented; render(); });
$("tDiff").addEventListener("click", () => { showDiff = !showDiff; render(); });
$("tDeps").addEventListener("click", () => { showDeps = !showDeps; render(); });
app.addEventListener("input", (e) => {
  if (e.target.id === "search") { filter = e.target.value.toLowerCase(); renderNav(); $("search").focus(); }
});

// ---- new items -------------------------------------------------------------
const EMPTY = () => ({ added: [], modified: [], removed: [] });
function addItem(kind, host) {
  if (kind === "actor") {
    DOC.actors.push({ name: "New actor", name_locked: false, description: null, description_locked: false });
  } else if (kind === "property") {
    (host.properties = host.properties || EMPTY()).added.push({ name: "newProperty", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, nullable: false, collection: false });
  } else if (kind === "rule") {
    (host.rules = host.rules || EMPTY()).added.push({ name: "New rule", name_locked: false, ruleType: null, description: null, description_locked: false });
  } else if (kind === "scenario") {
    (host.scenarios = host.scenarios || EMPTY()).added.push({ name: "New scenario", name_locked: false, description: "", description_locked: false, given: "", given_locked: false, when: "", when_locked: false, then: "", then_locked: false });
  } else if (kind === "qa") {
    (host.qualityAttributes = host.qualityAttributes || EMPTY()).added.push({ name: "New quality attribute", name_locked: false, type: null, description: null, description_locked: false });
  } else if (kind === "behaviour") {
    (host.behaviours = host.behaviours || EMPTY()).added.push({ name: "NewBehaviour", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, isPublic: false, actor: null, actor_locked: false, input: EMPTY(), output: EMPTY(), usedBuildingBlocks: EMPTY(), rules: EMPTY(), scenarios: EMPTY(), qualityAttributes: EMPTY() });
  } else if (kind === "block") {
    (host.buildingBlocks = host.buildingBlocks || EMPTY()).added.push({ name: "NewBlock", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, implements: [], properties: EMPTY(), behaviours: EMPTY(), rules: EMPTY(), scenarios: EMPTY(), qualityAttributes: EMPTY() });
  }
  render();
}

render();
</script>
