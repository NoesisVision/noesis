* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;

}
button { font: inherit; color: inherit; }
::selection { background: color-mix(in oklch, var(--primary) 22%, transparent); }

.field { display: inline-flex; align-items: baseline; gap: 4px; max-width: 100%; }
.ed {
  border-radius: 4px;
  padding: 1px 4px;
  margin: -1px -4px;
  outline: none;
  transition: background 90ms ease, box-shadow 90ms ease;
  white-space: pre-wrap;
  word-break: break-word;
}
.ed:hover:not(.is-locked) { background: color-mix(in oklch, var(--primary) 7%, transparent); }
.ed:focus {
  background: var(--card);
  box-shadow: 0 0 0 2px color-mix(in oklch, var(--ring) 45%, transparent);
}
.ed.is-empty::before {
  content: attr(data-placeholder);
  color: var(--muted-foreground);
  font-style: italic;
}
.ed.is-locked { background: color-mix(in oklch, var(--muted) 60%, transparent); cursor: default; }
.lock {
  border: 0;
  background: none;
  padding: 1px 2px;
  border-radius: 4px;
  color: var(--muted-foreground);
  opacity: 0;
  cursor: pointer;
  line-height: 0;
  transition: opacity 90ms ease;
}
.field:hover .lock, .lock.on { opacity: 1; }
.lock.on { color: var(--primary); }
.lock:hover { background: var(--accent); }
.sel {
  font: inherit;
  font-size: 12px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: inherit;
}
.sel:disabled { background: var(--muted); color: var(--muted-foreground); }

  border-radius: 999px;
  border: 1px solid transparent;

.muted { color: var(--muted-foreground); }

const BLOCK_TYPES = [
  "aggregate", "entity", "value_object", "domain_event", "domain_command",
  "domain_query", "domain_service", "application_service", "repository",
  "factory", "external_integration",
];
const BEHAVIOUR_TYPES = ["Command", "Event", "Query"];
const RULE_TYPES = ["Consistency", "Structure", "Computation", "State change"];
const QA_TYPES = ["performance", "availability", "security", "other"];

// ---- change-set helpers ----------------------------------------------------
// A change set is { added, modified, removed }. Everywhere the prototypes need a
// plain list, items get a _change tag and removed names become ghost entries.
const EMPTY_CS = { added: [], modified: [], removed: [] };
function items(cs) {
  const c = cs || EMPTY_CS;
  // A StringChangeSet holds bare strings (behaviour input / output / used
  // blocks); everything else holds objects. Both come out as {name, ...}.
  const tag = (i, change) =>
    typeof i === "string" ? { name: i, _change: change } : { ...i, _change: change };
  return [
    ...(c.added || []).map((i) => tag(i, "added")),
    ...(c.modified || []).map((i) => tag(i, "modified")),
    ...(c.removed || []).map((name) => ({ name, _change: "removed" })),
  ];
}
function live(cs) {
  return items(cs).filter((i) => i._change !== "removed");
}
function csCount(cs) {
  const c = cs || EMPTY_CS;
  return (c.added || []).length + (c.modified || []).length + (c.removed || []).length;
}

// ---- flattened index over the doc -----------------------------------------
// Every building block, with the context/module it lives in. Blocks declared on
// a context directly have module === null.
function indexBlocks(doc) {
  const out = [];
  for (const ctx of live(doc.boundedContexts)) {
    for (const b of items(ctx.buildingBlocks)) {
      out.push({ block: b, context: ctx.name, module: null });
    }
    for (const mod of live(ctx.modules)) {
      for (const b of items(mod.buildingBlocks)) {
        out.push({ block: b, context: ctx.name, module: mod.name });
      }
    }
  }
  return out;
}

// Use cases. A use case is a public behaviour of an application service — the
// system's entry points. Public behaviours on aggregates or domain services are
// still behaviours, but they are not use cases.
function useCases(doc) {
  const out = [];
  for (const { block, context, module } of indexBlocks(doc)) {
    if (block.type !== "application_service" || block._change === "removed") continue;
    for (const beh of live(block.behaviours)) {
      if (beh.isPublic) out.push({ behaviour: beh, block, context, module });
    }
  }
  return out;
}
function useCaseCount(block) {
  if (!block || block.type !== "application_service") return 0;
  return live(block.behaviours).filter((b) => b.isPublic).length;
}
// Use cases grouped by actor, unattributed ones last.
function useCasesByActor(doc) {
  const groups = new Map();
  for (const uc of useCases(doc)) {
    const key = uc.behaviour.actor || "Unassigned";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(uc);
  }
  const known = doc.actors.map((a) => a.name).filter((n) => groups.has(n));
  const rest = [...groups.keys()].filter((k) => !known.includes(k));
  return [...known, ...rest].map((actor) => ({ actor, cases: groups.get(actor) }));
}

// Edges between building blocks: `implements` plus every behaviour's
// usedBuildingBlocks. Only edges whose both ends exist in the doc are kept.
function blockEdges(doc) {
  const index = indexBlocks(doc);
  const known = new Set(index.map((e) => e.block.name));
  const edges = [];
  const seen = new Set();
  const push = (from, to, kind) => {
    if (!known.has(to) || from === to) return;
    const key = `${from}|${to}|${kind}`;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from, to, kind });
  };
  for (const { block } of index) {
    for (const target of block.implements || []) push(block.name, target, "implements");
    for (const beh of live(block.behaviours)) {
      for (const target of live(beh.usedBuildingBlocks).map((i) => i.name || i)) {
        push(block.name, target, "uses");
      }
    }
  }
  return edges;
}

const TYPE_LABEL = {
  aggregate: "Aggregate", entity: "Entity", value_object: "Value object",
  domain_event: "Domain event", domain_command: "Domain command",
  domain_query: "Domain query", domain_service: "Domain service",
  application_service: "Application service", repository: "Repository",
  factory: "Factory", external_integration: "External integration",
};
const TYPE_SHORT = {
  aggregate: "AGG", entity: "ENT", value_object: "VO", domain_event: "EVT",
  domain_command: "CMD", domain_query: "QRY", domain_service: "DS",
  application_service: "AS", repository: "REPO", factory: "FAC",
  external_integration: "EXT",
};
// Hue per block type. Kept as an oklch triple so light and dark themes can
// derive fill / border / text from the same anchor.
const TYPE_HUE = {
  aggregate: 39, entity: 150, value_object: 250, domain_event: 300,
  domain_command: 20, domain_query: 200, domain_service: 100,
  application_service: 70, repository: 330, factory: 175, external_integration: 15,
};
function typeColor(type, kind) {
  const h = TYPE_HUE[type] ?? 90;
  if (kind === "fill") return `oklch(0.94 0.045 ${h})`;
  if (kind === "stroke") return `oklch(0.66 0.13 ${h})`;
  return `oklch(0.42 0.11 ${h})`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

<script>
// ---- live-object registry --------------------------------------------------
// Editors bind to the real objects inside DOC, so an edit mutates the document
// in place and any other view re-reads the new value on its next render.
const REFS = [];
function ref(obj) {
  const i = REFS.indexOf(obj);
  return i === -1 ? REFS.push(obj) - 1 : i;
}
function deref(id) {
  return REFS[Number(id)];
}

// ---- editable primitives ---------------------------------------------------
// `editable` renders one field of one object. `lock` mirrors the *_locked flags
// from the schema: a locked field is protected from further AI rewrites, so it
// renders read-only with the lock lit.
function editable(obj, key, opts = {}) {
  const lockKey = opts.lockKey === null ? null : opts.lockKey || `${key}_locked`;
  const locked = lockKey ? !!obj[lockKey] : false;
  const value = obj[key];
  const empty = value === null || value === undefined || value === "";
  const cls = ["ed", opts.class || "", empty ? "is-empty" : "", locked ? "is-locked" : ""].join(" ");
  const text = empty ? "" : esc(value);
  const lockBtn = lockKey
    ? `<button class="lock${locked ? " on" : ""}" data-lock="${ref(obj)}" data-key="${lockKey}" title="${locked ? "Locked — AI will not rewrite this" : "Unlocked — AI may rewrite this"}">${locked ? LOCK_ON : LOCK_OFF}</button>`
    : "";
  return `<span class="field"><span class="${cls}" contenteditable="${locked ? "false" : "plaintext-only"}" data-ref="${ref(obj)}" data-key="${key}" data-placeholder="${esc(opts.placeholder || "empty")}">${text}</span>${lockBtn}</span>`;
}

function enumSelect(obj, key, options, opts = {}) {
  const lockKey = opts.lockKey === null ? null : opts.lockKey || `${key}_locked`;
  const locked = lockKey ? !!obj[lockKey] : false;
  const current = obj[key];
  const opts_ = [`<option value=""${current ? "" : " selected"}>—</option>`]
    .concat(options.map((o) => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(opts.label ? opts.label(o) : o)}</option>`))
    .join("");
  const lockBtn = lockKey
    ? `<button class="lock${locked ? " on" : ""}" data-lock="${ref(obj)}" data-key="${lockKey}">${locked ? LOCK_ON : LOCK_OFF}</button>`
    : "";
  return `<span class="field"><select class="sel" data-ref="${ref(obj)}" data-key="${key}"${locked ? " disabled" : ""}>${opts_}</select>${lockBtn}</span>`;
}

const LOCK_ON = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg>`;
const LOCK_OFF = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 1 3.5 3.5.75.75 0 0 1-1.5 0 2 2 0 1 0-4 0V6H12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h.5V4.5A3.5 3.5 0 0 1 8 1Z"/></svg>`;

// Wires every editor inside `root`. `onChange(kind)` fires after a value lands,
// so a view can re-render the parts that depend on it (graph labels, counters).
function bindEditors(root, onChange) {
  root.addEventListener("input", (e) => {
    const el = e.target.closest("[data-ref][contenteditable]");
    if (!el) return;
    const obj = deref(el.dataset.ref);
    const text = el.textContent.trim();
    obj[el.dataset.key] = text === "" ? null : text;
    el.classList.toggle("is-empty", text === "");
    onChange && onChange("text", obj, el.dataset.key);
  });
  root.addEventListener("change", (e) => {
    const el = e.target.closest("select[data-ref]");
    if (!el) return;
    const obj = deref(el.dataset.ref);
    obj[el.dataset.key] = el.value === "" ? null : el.value;
    onChange && onChange("select", obj, el.dataset.key);
  });
  root.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-lock]");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const obj = deref(btn.dataset.lock);
    obj[btn.dataset.key] = !obj[btn.dataset.key];
    onChange && onChange("lock", obj, btn.dataset.key);
  });
  // Enter commits instead of inserting a newline in single-line fields.
  root.addEventListener("keydown", (e) => {
    const el = e.target.closest('[data-ref][contenteditable]:not(.multiline)');
    if (el && e.key === "Enter") {
      e.preventDefault();
      el.blur();
    }
  });
}

// ---- tidy left-to-right tree layout ---------------------------------------
// Nodes are {id, label, children}. Leaves take the next free row, a parent is
// centred on its children. Enough for a design doc's shallow containment tree.
function layoutTree(root, opts = {}) {
  const nodeW = opts.nodeW || 168;
  const nodeH = opts.nodeH || 40;
  const gapX = opts.gapX || 64;
  const gapY = opts.gapY || 14;
  const rowH = nodeH + gapY;
  const placed = [];
  let row = 0;
  function walk(node, depth) {
    const kids = node.children || [];
    let y;
    if (kids.length === 0) {
      y = row * rowH;
      row += 1;
    } else {
      const ys = kids.map((k) => walk(k, depth + 1));
      y = (ys[0] + ys[ys.length - 1]) / 2;
    }
    placed.push({ node, depth, x: depth * (nodeW + gapX), y, w: nodeW, h: nodeH });
    return y;
  }
  walk(root, 0);
  const maxDepth = Math.max(...placed.map((p) => p.depth));
  return {
    nodes: placed,
    width: (maxDepth + 1) * nodeW + maxDepth * gapX,
    height: Math.max(row, 1) * rowH,
    nodeW, nodeH,
  };
}

// Bezier from the right edge of `a` to the left edge of `b`.
function elbow(a, b) {
  const x1 = a.x + a.w;
  const y1 = a.y + a.h / 2;
  const x2 = b.x;
  const y2 = b.y + b.h / 2;
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

// Arc between two arbitrary boxes, used for dependency edges that skip levels.
function arc(a, b) {
  const ax = a.x + a.w / 2;
  const ay = a.y + a.h / 2;
  const bx = b.x + b.w / 2;
  const by = b.y + b.h / 2;
  const dx = bx - ax;
  const dy = by - ay;
  const bow = Math.min(120, Math.hypot(dx, dy) * 0.35);
  const mx = (ax + bx) / 2 - (dy / (Math.hypot(dx, dy) || 1)) * bow;
  const my = (ay + by) / 2 + (dx / (Math.hypot(dx, dy) || 1)) * bow;
  return `M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`;
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

function changeBadge(change) {
  if (change === "added") return `<span class="badge add">added</span>`;
  if (change === "modified") return `<span class="badge mod">changed</span>`;
  if (change === "removed") return `<span class="badge del">removed</span>`;
  return "";
}

<script>
// ---------------------------------------------------------------------------
// Prototype C — the doc is one manuscript.
// Everything is on a single scroll; each bounded context opens with an inline
// tree diagram of its building blocks that doubles as navigation into the prose
// below it. No panes, no modal editors — you edit where you read.
// ---------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);

let showDiff = true;
let showDiagrams = true;
let compact = false;   // compact hides properties / scenarios detail
let focused = null;    // block name highlighted from a diagram click

const slug = (s) => "n-" + String(s).replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase();
function badgeOf(i) { return showDiff ? changeBadge(i._change) : ""; }
function typeTag(type) {
  if (!type) return `<span class="tag" style="background:var(--muted);color:var(--muted-foreground)">?</span>`;
  return `<span class="tag" style="background:${typeColor(type, "fill")};color:${typeColor(type, "text")}">${TYPE_SHORT[type]}</span>`;
}
function chipList(cs, linkable) {
  const list = items(cs);
  if (!list.length) return `<span class="muted">—</span>`;
  return `<span class="chips">${list.map((i) => `<span class="chip${linkable ? " link" : ""}"${linkable ? ` data-goto="${esc(i.name)}"` : ""}${i._change === "removed" ? ' style="text-decoration:line-through;opacity:.6"' : ""}>${esc(i.name)}</span>`).join("")}</span>`;
}

// ---- inline diagram --------------------------------------------------------
function diagram(ctx) {
  const root = { id: `c:${ctx.name}`, label: ctx.name, kind: "context", children: [] };
  for (const b of live(ctx.buildingBlocks)) root.children.push({ id: `b:${b.name}`, label: b.name, kind: "block", block: b, children: [] });
  for (const m of live(ctx.modules)) {
    const mn = { id: `m:${m.name}`, label: m.name, kind: "module", children: [] };
    root.children.push(mn);
    for (const b of live(m.buildingBlocks)) mn.children.push({ id: `b:${b.name}`, label: b.name, kind: "block", block: b, children: [] });
  }
  const laid = layoutTree(root, { nodeW: 164, nodeH: 38, gapX: 52, gapY: 10 });
  const box = new Map(laid.nodes.map((p) => [p.node.id, p]));
  const pad = 10;
  let s = `<svg width="${laid.width + pad * 2}" height="${laid.height + pad * 2}" viewBox="0 0 ${laid.width + pad * 2} ${laid.height + pad * 2}">
    <defs><marker id="a-${slug(ctx.name)}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker></defs>
    <g transform="translate(${pad},${pad})">`;
  const walk = (n) => { for (const k of n.children || []) { s += `<path class="edge" d="${elbow(box.get(n.id), box.get(k.id))}"/>`; walk(k); } };
  walk(root);
  for (const e of blockEdges(DOC)) {
    const a = box.get(`b:${e.from}`), b = box.get(`b:${e.to}`);
    if (!a || !b) continue; // only relations inside this context are drawn
    s += `<path class="dep ${e.kind}" marker-end="url(#a-${slug(ctx.name)})" d="${arc(a, b)}"/>`;
  }
  for (const p of laid.nodes) {
    const n = p.node;
    let fill = "var(--secondary)", stroke = "var(--input)", text = "var(--foreground)", sub = n.kind === "context" ? "bounded context" : "module";
    if (n.kind === "block") {
      fill = typeColor(n.block.type, "fill"); stroke = typeColor(n.block.type, "stroke");
      text = typeColor(n.block.type, "text"); sub = TYPE_LABEL[n.block.type] || "untyped";
    }
    const label = n.label.length > 20 ? n.label.slice(0, 19) + "…" : n.label;
    const target = n.kind === "block" ? n.label : null;
    s += `<g class="n${focused && focused === n.label ? " focus" : ""}" transform="translate(${p.x},${p.y})"${target ? ` data-jump="${esc(target)}"` : ""}>
      <rect class="bg" width="${p.w}" height="${p.h}" rx="8" fill="${fill}" stroke="${stroke}"/>
      <text class="nlabel" x="10" y="16" fill="${text}">${esc(label)}</text>
      <text class="nsub" x="10" y="29" fill="${text}" opacity="0.7">${esc(sub)}</text></g>`;
  }
  return `<div class="diagram${showDiagrams ? "" : " hidden"}">
    <div class="diagram-head"><span>${esc(ctx.name)} — building blocks</span><span style="flex:1"></span><span>solid = contains · dashed = uses / implements</span></div>
    <div class="diagram-body">${s}</g></svg></div></div>`;
}

// ---- document sections -----------------------------------------------------
function propertiesTable(b) {
  const list = items(b.properties);
  if (!list.length && compact) return "";
  let h = `<h4 class="sec">Properties</h4><table class="props"><tr><th style="width:24%">Name</th><th style="width:22%">Type</th><th>Description</th><th style="width:96px"></th></tr>`;
  for (const p of list) {
    if (p._change === "removed") { h += `<tr class="removed"><td>${esc(p.name)}</td><td colspan="2"></td><td>${badgeOf(p)}</td></tr>`; continue; }
    h += `<tr><td>${editable(p, "name")}</td><td class="mono">${editable(p, "type", { placeholder: "type" })}</td>
      <td class="muted">${editable(p, "description", { class: "multiline", placeholder: "describe" })}</td>
      <td><button class="flagbtn${p.nullable ? " on" : ""}" data-flag="${ref(p)}" data-key="nullable">null</button>
        <button class="flagbtn${p.collection ? " on" : ""}" data-flag="${ref(p)}" data-key="collection">list</button> ${badgeOf(p)}</td></tr>`;
  }
  h += `</table><div style="margin-top:6px"><button class="addbtn" data-add="property" data-host="${ref(b)}">+ property</button></div>`;
  return h;
}

function rulesList(host, heading) {
  const list = items(host.rules);
  let h = `<h4 class="sec">${heading}</h4>`;
  for (const r of list) {
    if (r._change === "removed") { h += `<div class="row removed muted"><s>${esc(r.name)}</s> ${badgeOf(r)}</div>`; continue; }
    h += `<div class="row"><div class="row-head"><span class="nm">${editable(r, "name")}</span>${enumSelect(r, "ruleType", RULE_TYPES, { lockKey: null })}<span style="flex:1"></span>${badgeOf(r)}</div>
      <div class="para dim">${editable(r, "description", { class: "multiline", placeholder: "state the rule" })}</div></div>`;
  }
  if (!list.length) h += `<div class="para dim">No rules yet.</div>`;
  h += `<div style="margin-top:6px"><button class="addbtn" data-add="rule" data-host="${ref(host)}">+ rule</button></div>`;
  return h;
}

function scenariosList(host) {
  const list = items(host.scenarios);
  if (!list.length && compact) return "";
  let h = `<h4 class="sec">Scenarios</h4>`;
  for (const s of list) {
    if (s._change === "removed") { h += `<div class="row muted"><s>${esc(s.name)}</s> ${badgeOf(s)}</div>`; continue; }
    h += `<div class="row"><div class="row-head"><span class="nm">${editable(s, "name")}</span><span style="flex:1"></span>${badgeOf(s)}</div>
      <div class="para dim">${editable(s, "description", { class: "multiline", placeholder: "what it shows" })}</div>
      ${compact ? "" : `<div class="gwt"><span class="g">Given</span><span>${editable(s, "given", { class: "multiline" })}</span>
        <span class="g">When</span><span>${editable(s, "when", { class: "multiline" })}</span>
        <span class="g">Then</span><span>${editable(s, "then", { class: "multiline" })}</span></div>`}</div>`;
  }
  h += `<div style="margin-top:6px"><button class="addbtn" data-add="scenario" data-host="${ref(host)}">+ scenario</button></div>`;
  return h;
}

function qaList(host) {
  const list = items(host.qualityAttributes);
  if (!list.length) return "";
  let h = `<h4 class="sec">Quality attributes</h4>`;
  for (const q of list) {
    h += `<div class="row"><div class="row-head"><span class="nm">${editable(q, "name")}</span>${enumSelect(q, "type", QA_TYPES, { lockKey: null })}<span style="flex:1"></span>${badgeOf(q)}</div>
      <div class="para dim">${editable(q, "description", { class: "multiline", placeholder: "measurable target" })}</div></div>`;
  }
  return h;
}

function behaviourBlock(beh, onAppService) {
  if (beh._change === "removed") return `<div class="beh muted"><s>${esc(beh.name)}</s> ${badgeOf(beh)}</div>`;
  const isUseCase = onAppService && beh.isPublic;
  return `<div class="beh ${showDiff ? beh._change : ""}">
    <div class="row-head">${typeTagBeh(beh)}<span class="nm">${editable(beh, "name")}</span>
      ${isUseCase ? `<span class="badge" style="color:var(--primary);background:color-mix(in oklch, var(--primary) 12%, transparent);border-color:color-mix(in oklch, var(--primary) 30%, transparent)">use case</span>` : ""}
      ${enumSelect(beh, "type", BEHAVIOUR_TYPES)}
      <button class="flagbtn${beh.isPublic ? " on" : ""}" data-flag="${ref(beh)}" data-key="isPublic">public</button>
      <span style="flex:1"></span>${badgeOf(beh)}</div>
    <div class="para dim">${editable(beh, "description", { class: "multiline", placeholder: "what it does" })}</div>
    <div class="sub">
      <span class="k">Actor</span><span>${editable(beh, "actor", { placeholder: "no actor" })}</span>
      <span class="k">Input</span><span>${chipList(beh.input)}</span>
      <span class="k">Output</span><span>${chipList(beh.output)}</span>
      <span class="k">Uses</span><span>${chipList(beh.usedBuildingBlocks, true)}</span>
    </div>
    ${rulesList(beh, "Rules")}
    ${scenariosList(beh)}
    ${qaList(beh)}</div>`;
}
function typeTagBeh(beh) {
  const hue = beh.type === "Command" ? 20 : beh.type === "Event" ? 300 : 200;
  return `<span class="tag" style="background:oklch(0.94 0.045 ${hue});color:oklch(0.42 0.11 ${hue})">${esc((beh.type || "?").slice(0, 3).toUpperCase())}</span>`;
}

function blockSection(b) {
  if (b._change === "removed") {
    return `<div class="block removed" id="${slug(b.name)}"><div class="b-head"><span class="b-name">${esc(b.name)}</span>${badgeOf(b)}</div></div>`;
  }
  return `<div class="block ${showDiff ? b._change : ""}${focused === b.name ? " focus" : ""}" id="${slug(b.name)}" data-block="${esc(b.name)}">
    <div class="b-head">${typeTag(b.type)}<span class="b-name">${editable(b, "name")}</span>
      ${enumSelect(b, "type", BLOCK_TYPES, { label: (t) => TYPE_LABEL[t] })}<span style="flex:1"></span>${badgeOf(b)}</div>
    <div class="para dim" style="margin-top:6px">${editable(b, "description", { class: "multiline", placeholder: "what this block is responsible for" })}</div>
    ${(b.implements || []).length ? `<div class="sub"><span class="k">Implements</span><span>${chipList({ added: b.implements.map((n) => ({ name: n })) }, true)}</span></div>` : ""}
    ${propertiesTable(b)}
    ${csCount(b.behaviours) || !compact ? `<h4 class="sec">Behaviours</h4>${items(b.behaviours).map((beh) => behaviourBlock(beh, b.type === "application_service")).join("")}
      <button class="addbtn" data-add="behaviour" data-host="${ref(b)}">+ behaviour</button>` : ""}
    ${rulesList(b, "Invariants")}
    ${scenariosList(b)}
    ${qaList(b)}
  </div>`;
}

function renderSheet() {
  let h = `<h1 class="doc-h">${editable(DOC, "name")}</h1>
    <div class="meta"><span class="mono">${esc(DOC.id)}</span><span>·</span><span>${esc(DOC.date)}</span><span>·</span>
      <span>${live(DOC.boundedContexts).length} contexts</span><span>·</span><span>${indexBlocks(DOC).length} building blocks</span>
      <button class="pill${DOC.implemented ? " on" : ""}" id="tImpl">${DOC.implemented ? "implemented" : "not implemented"}</button></div>
    <div class="lede">${editable(DOC, "description", { class: "multiline" })}</div>
    <h4 class="sec">Actors</h4>`;
  for (const a of DOC.actors) {
    h += `<div class="row"><div class="row-head"><span class="nm">${editable(a, "name")}</span></div>
      <div class="para dim">${editable(a, "description", { class: "multiline", placeholder: "who they are" })}</div></div>`;
  }
  h += `<div style="margin-top:6px"><button class="addbtn" data-add="actor">+ actor</button></div>`;

  // Use cases: the public behaviours of application services, gathered up front
  // so the reader sees the entry points before the building blocks.
  h += `<h4 class="sec">Use cases <span style="letter-spacing:0;text-transform:none">${useCases(DOC).length}</span></h4>`;
  for (const g of useCasesByActor(DOC)) {
    h += `<h3 class="mod-h" style="margin:14px 0 2px">${esc(g.actor)}</h3>`;
    for (const uc of g.cases) {
      const b = uc.behaviour;
      const scn = items(b.scenarios).filter((s) => s._change !== "removed");
      h += `<div class="row"><div class="row-head">${typeTagBeh(b)}<span class="nm">${editable(b, "name")}</span>
        <span class="chip link" data-goto="${esc(uc.block.name)}">${esc(uc.block.name)}</span>
        <span class="muted" style="font-size:11px">${esc(uc.context)}</span><span style="flex:1"></span>
        <span class="muted" style="font-size:11px">${plural(csCount(b.rules), "rule")} · ${plural(scn.length, "scenario")}</span>${badgeOf(b)}</div>
        <div class="para dim">${editable(b, "description", { class: "multiline", placeholder: "what the actor achieves" })}</div>
        ${scn.map((s) => `<div class="gwt"><span class="g">Given</span><span>${editable(s, "given", { class: "multiline" })}</span>
          <span class="g">When</span><span>${editable(s, "when", { class: "multiline" })}</span>
          <span class="g">Then</span><span>${editable(s, "then", { class: "multiline" })}</span></div>`).join("")}</div>`;
    }
  }

  for (const ctx of live(DOC.boundedContexts)) {
    h += `<h2 class="ctx-h" id="${slug("ctx-" + ctx.name)}">${editable(ctx, "name")}${badgeOf(ctx)}</h2>
      <div class="para dim">${editable(ctx, "description", { class: "multiline", placeholder: "what this context owns" })}</div>
      ${diagram(ctx)}
      ${qaList(ctx)}`;
    for (const b of items(ctx.buildingBlocks)) h += blockSection(b);
    for (const mod of live(ctx.modules)) {
      h += `<h3 class="mod-h" id="${slug("mod-" + mod.name)}">${editable(mod, "name")}${badgeOf(mod)}</h3>
        <div class="para dim">${editable(mod, "description", { class: "multiline", placeholder: "what this module groups" })}</div>`;
      for (const b of items(mod.buildingBlocks)) h += blockSection(b);
      h += `<button class="addbtn" data-add="block" data-host="${ref(mod)}">+ building block</button>`;
    }
  }
  $("sheet").innerHTML = h;
}

function outlineRow(b) {
  const gone = b._change === "removed";
  return `<div class="o-row blk${focused === b.name ? " on" : ""}"${gone ? ' style="opacity:.5;text-decoration:line-through"' : ""} data-jump="${esc(b.name)}">${typeTag(b.type)}${esc(b.name)}</div>`;
}

function renderOutline() {
  let h = `<div class="o-row ctx${focused === null ? " on" : ""}" data-jump-h="${slug("top")}">${esc(DOC.name)}</div><div class="o-group">Contents</div>`;
  for (const ctx of live(DOC.boundedContexts)) {
    h += `<div class="o-row ctx" data-jump-h="${slug("ctx-" + ctx.name)}">${esc(ctx.name)}</div>`;
    for (const b of items(ctx.buildingBlocks)) h += outlineRow(b);
    for (const mod of live(ctx.modules)) {
      h += `<div class="o-row mod" data-jump-h="${slug("mod-" + mod.name)}">${esc(mod.name)}</div>`;
      for (const b of items(mod.buildingBlocks)) h += outlineRow(b);
    }
  }
  $("outline").innerHTML = h;
}

function render() {
  $("topTitle").textContent = DOC.name;
  $("topMeta").textContent = `${DOC.date} · ${indexBlocks(DOC).length} blocks`;
  $("tDiff").classList.toggle("on", showDiff);
  $("tDiagrams").classList.toggle("on", showDiagrams);
  $("tCompact").classList.toggle("on", compact);
  renderSheet();
  renderOutline();
}

function jumpTo(name) {
  focused = name;
  render();
  const el = document.getElementById(slug(name));
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

const app = $("app");
bindEditors(app, (kind) => { if (kind !== "text") render(); else renderOutline(); });

app.addEventListener("click", (e) => {
  const jump = e.target.closest("[data-jump]");
  if (jump) { jumpTo(jump.dataset.jump); return; }
  const goto = e.target.closest("[data-goto]");
  if (goto) { jumpTo(goto.dataset.goto); return; }
  const jh = e.target.closest("[data-jump-h]");
  if (jh) { const el = document.getElementById(jh.dataset.jumpH); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); else $("paper").scrollTo({ top: 0, behavior: "smooth" }); return; }
  const flag = e.target.closest("[data-flag]");
  if (flag) { const o = deref(flag.dataset.flag); o[flag.dataset.key] = !o[flag.dataset.key]; render(); return; }
  const add = e.target.closest("[data-add]");
  if (add) { addItem(add.dataset.add, add.dataset.host ? deref(add.dataset.host) : null); return; }
  if (e.target.id === "tImpl") { DOC.implemented = !DOC.implemented; render(); }
});

$("tDiff").addEventListener("click", () => { showDiff = !showDiff; render(); });
$("tDiagrams").addEventListener("click", () => { showDiagrams = !showDiagrams; render(); });
$("tCompact").addEventListener("click", () => { compact = !compact; render(); });

const EMPTY = () => ({ added: [], modified: [], removed: [] });
function addItem(kind, host) {
  if (kind === "actor") DOC.actors.push({ name: "New actor", name_locked: false, description: null, description_locked: false });
  if (kind === "property") (host.properties = host.properties || EMPTY()).added.push({ name: "newProperty", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, nullable: false, collection: false });
  if (kind === "rule") (host.rules = host.rules || EMPTY()).added.push({ name: "New rule", name_locked: false, ruleType: null, description: null, description_locked: false });
  if (kind === "scenario") (host.scenarios = host.scenarios || EMPTY()).added.push({ name: "New scenario", name_locked: false, description: "", description_locked: false, given: "", given_locked: false, when: "", when_locked: false, then: "", then_locked: false });
  if (kind === "qa") (host.qualityAttributes = host.qualityAttributes || EMPTY()).added.push({ name: "New quality attribute", name_locked: false, type: null, description: null, description_locked: false });
  if (kind === "behaviour") (host.behaviours = host.behaviours || EMPTY()).added.push({ name: "NewBehaviour", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, isPublic: false, actor: null, actor_locked: false, input: EMPTY(), output: EMPTY(), usedBuildingBlocks: EMPTY(), rules: EMPTY(), scenarios: EMPTY(), qualityAttributes: EMPTY() });
  if (kind === "block") (host.buildingBlocks = host.buildingBlocks || EMPTY()).added.push({ name: "NewBlock", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, implements: [], properties: EMPTY(), behaviours: EMPTY(), rules: EMPTY(), scenarios: EMPTY(), qualityAttributes: EMPTY() });
  render();
}

render();
</script>
