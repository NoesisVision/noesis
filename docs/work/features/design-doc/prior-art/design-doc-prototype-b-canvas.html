<style>

  --add-soft: oklch(0.94 0.05 150);
  --mod: oklch(0.62 0.13 75);

  --shadow-lg: 0 1px 3px 0 hsl(0 0% 0% / 0.1), 0 8px 24px -4px hsl(0 0% 0% / 0.18);

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--foreground);
  background: var(--background);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
::selection { background: color-mix(in oklch, var(--primary) 22%, transparent); }

/* ---- inline editable fields ---- */
.field { display: inline-flex; align-items: baseline; gap: 4px; max-width: 100%; }
.ed {
  border-radius: 4px;
  padding: 1px 4px;
  margin: -1px -4px;
  outline: none;
  transition: background 90ms ease, box-shadow 90ms ease;
  white-space: pre-wrap;
  word-break: break-word;
}
.ed:hover:not(.is-locked) { background: color-mix(in oklch, var(--primary) 7%, transparent); }
.ed:focus {
  background: var(--card);
  box-shadow: 0 0 0 2px color-mix(in oklch, var(--ring) 45%, transparent);
}
.ed.is-empty::before {
  content: attr(data-placeholder);
  color: var(--muted-foreground);
  font-style: italic;
}
.ed.is-locked { background: color-mix(in oklch, var(--muted) 60%, transparent); cursor: default; }
.lock {
  border: 0;
  background: none;
  padding: 1px 2px;
  border-radius: 4px;
  color: var(--muted-foreground);
  opacity: 0;
  cursor: pointer;
  line-height: 0;
  transition: opacity 90ms ease;
}
.field:hover .lock, .lock.on { opacity: 1; }
.lock.on { color: var(--primary); }
.lock:hover { background: var(--accent); }
.sel {
  font: inherit;
  font-size: 12px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: inherit;
}
.sel:disabled { background: var(--muted); color: var(--muted-foreground); }

/* ---- change-set badges ---- */
.badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge.add { color: var(--add); background: var(--add-soft); border-color: color-mix(in oklch, var(--add) 25%, transparent); }
.badge.mod { color: var(--mod); background: var(--mod-soft); border-color: color-mix(in oklch, var(--mod) 25%, transparent); }
.badge.del { color: var(--del); background: var(--del-soft); border-color: color-mix(in oklch, var(--del) 25%, transparent); }

.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--muted-foreground); }


#app { display: flex; flex-direction: column; height: 100vh; }
header.top {
  display: flex; align-items: center; gap: 10px; flex: none;
  padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--card);
}
.title { font-size: 14px; font-weight: 600; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--card);
  color: var(--muted-foreground); cursor: pointer; white-space: nowrap;
}
.pill.on { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.search { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); width: 190px; }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
main.collapsed { grid-template-columns: minmax(0, 1fr) 0; }

/* ---- canvas ---- */
.canvas-wrap { position: relative; overflow: hidden; background: var(--canvas); }
.canvas-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.canvas-wrap svg.panning { cursor: grabbing; }
.filters {
  position: absolute; left: 12px; top: 12px; z-index: 3; display: flex; flex-direction: column; gap: 5px;
  background: color-mix(in oklch, var(--card) 88%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px; box-shadow: var(--shadow-sm);
  max-height: calc(100% - 24px); overflow: auto;
}
.filters .h { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin-bottom: 2px; }
.fitem { display: flex; align-items: center; gap: 6px; font-size: 11.5px; cursor: pointer; padding: 1px 3px; border-radius: 5px; }
.fitem:hover { background: var(--accent); }
.fitem.off { opacity: 0.38; }
.fitem i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.zoombar { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: flex; gap: 4px; }
.zoombar button {
  width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; box-shadow: var(--shadow-sm); line-height: 1;
}
.zoombar button.wide { width: auto; padding: 0 10px; font-size: 12px; }

svg text { font-family: var(--font-sans); }
svg .grp-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--muted-foreground); }
svg .mod-label { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; fill: var(--muted-foreground); }
svg .n-name { font-size: 12.5px; font-weight: 560; }
svg .n-type { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; }
svg .n-meta { font-size: 9.5px; }
svg g.node { cursor: grab; }
svg g.node.dragging { cursor: grabbing; }
svg g.node.dim { opacity: 0.42; }
svg .link { fill: none; stroke-width: 1.4; }
svg .link.uses { stroke: oklch(0.62 0.13 250); stroke-dasharray: 5 4; }
svg .link.implements { stroke: oklch(0.6 0.12 300); }
svg .link.dim { opacity: 0.12; }
svg .link.hot { stroke-width: 2.4; opacity: 1; }

/* ---- inspector ---- */
aside.insp { border-left: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.insp-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
.insp-head .row { display: flex; align-items: center; gap: 8px; }
.insp-head h2 { margin: 0; font-size: 18px; font-weight: 620; }
.insp-path { font-size: 11px; color: var(--muted-foreground); margin-top: 2px; }
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab {

}
.tab.on { color: var(--foreground); border-bottom-color: var(--primary); font-weight: 550; }
.insp-body { flex: 1; overflow: auto; padding: 14px 16px 60px; }
.insp-empty { padding: 40px 16px; text-align: center; color: var(--muted-foreground); font-size: 13px; }
.kv { display: flex; gap: 8px; align-items: baseline; margin-bottom: 7px; }
.kv .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); min-width: 68px; flex: none; padding-top: 2px; }
.desc { line-height: 1.6; }
.sec { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-foreground); margin: 18px 0 7px; display: flex; align-items: center; gap: 8px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.item { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--card); }
.item.added { border-left: 3px solid var(--add); }
.item.modified { border-left: 3px solid var(--mod); }
.item.removed { border-left: 3px solid var(--del); opacity: 0.6; text-decoration: line-through; }
.item .head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.item .head .nm { font-weight: 550; }
.item .sub { color: var(--muted-foreground); font-size: 12.5px; margin-top: 3px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--secondary); border: 1px solid var(--border); }
.chip.link { cursor: pointer; }
.chip.link:hover { border-color: var(--primary); color: var(--primary); }
.gwt { display: grid; grid-template-columns: 46px 1fr; gap: 1px 8px; margin-top: 5px; font-size: 12.5px; }
.gwt .g { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); padding-top: 3px; }
.addbtn { border: 1px dashed var(--border); background: none; color: var(--muted-foreground); border-radius: 6px; font-size: 12px; padding: 3px 9px; cursor: pointer; }
.addbtn:hover { border-color: var(--primary); color: var(--primary); }
.flagbtn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; font-size: 10px; padding: 0 6px; cursor: pointer; color: var(--muted-foreground); }
.flagbtn.on { background: var(--secondary); color: var(--foreground); border-color: var(--input); }
.tag { font-family: var(--font-mono); font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
</style>

// ---- schema enums, kept in sync with design-doc.ts ----
const BLOCK_TYPES = [
  "aggregate", "entity", "value_object", "domain_event", "domain_command",
  "domain_query", "domain_service", "application_service", "repository",
  "factory", "external_integration",
];
const BEHAVIOUR_TYPES = ["Command", "Event", "Query"];
const RULE_TYPES = ["Consistency", "Structure", "Computation", "State change"];
const QA_TYPES = ["performance", "availability", "security", "other"];

// ---- change-set helpers ----------------------------------------------------
// A change set is { added, modified, removed }. Everywhere the prototypes need a
// plain list, items get a _change tag and removed names become ghost entries.
const EMPTY_CS = { added: [], modified: [], removed: [] };
function items(cs) {
  const c = cs || EMPTY_CS;
  // A StringChangeSet holds bare strings (behaviour input / output / used
  // blocks); everything else holds objects. Both come out as {name, ...}.
  const tag = (i, change) =>
    typeof i === "string" ? { name: i, _change: change } : { ...i, _change: change };
  return [
    ...(c.added || []).map((i) => tag(i, "added")),
    ...(c.modified || []).map((i) => tag(i, "modified")),
    ...(c.removed || []).map((name) => ({ name, _change: "removed" })),
  ];
}
function live(cs) {
  return items(cs).filter((i) => i._change !== "removed");
}
function csCount(cs) {
  const c = cs || EMPTY_CS;
  return (c.added || []).length + (c.modified || []).length + (c.removed || []).length;
}

// ---- flattened index over the doc -----------------------------------------
// Every building block, with the context/module it lives in. Blocks declared on
// a context directly have module === null.
function indexBlocks(doc) {
  const out = [];
  for (const ctx of live(doc.boundedContexts)) {
    for (const b of items(ctx.buildingBlocks)) {
      out.push({ block: b, context: ctx.name, module: null });
    }
    for (const mod of live(ctx.modules)) {
      for (const b of items(mod.buildingBlocks)) {
        out.push({ block: b, context: ctx.name, module: mod.name });
      }
    }
  }
  return out;
}

// Use cases. A use case is a public behaviour of an application service — the
// system's entry points. Public behaviours on aggregates or domain services are
// still behaviours, but they are not use cases.
function useCases(doc) {
  const out = [];
  for (const { block, context, module } of indexBlocks(doc)) {
    if (block.type !== "application_service" || block._change === "removed") continue;
    for (const beh of live(block.behaviours)) {
      if (beh.isPublic) out.push({ behaviour: beh, block, context, module });
    }
  }
  return out;
}
function useCaseCount(block) {
  if (!block || block.type !== "application_service") return 0;
  return live(block.behaviours).filter((b) => b.isPublic).length;
}
// Use cases grouped by actor, unattributed ones last.
function useCasesByActor(doc) {
  const groups = new Map();
  for (const uc of useCases(doc)) {
    const key = uc.behaviour.actor || "Unassigned";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(uc);
  }
  const known = doc.actors.map((a) => a.name).filter((n) => groups.has(n));
  const rest = [...groups.keys()].filter((k) => !known.includes(k));
  return [...known, ...rest].map((actor) => ({ actor, cases: groups.get(actor) }));
}

// Edges between building blocks: `implements` plus every behaviour's
// usedBuildingBlocks. Only edges whose both ends exist in the doc are kept.
function blockEdges(doc) {
  const index = indexBlocks(doc);
  const known = new Set(index.map((e) => e.block.name));
  const edges = [];
  const seen = new Set();
  const push = (from, to, kind) => {
    if (!known.has(to) || from === to) return;
    const key = `${from}|${to}|${kind}`;
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from, to, kind });
  };
  for (const { block } of index) {
    for (const target of block.implements || []) push(block.name, target, "implements");
    for (const beh of live(block.behaviours)) {
      for (const target of live(beh.usedBuildingBlocks).map((i) => i.name || i)) {
        push(block.name, target, "uses");
      }
    }
  }
  return edges;
}

const TYPE_LABEL = {
  aggregate: "Aggregate", entity: "Entity", value_object: "Value object",
  domain_event: "Domain event", domain_command: "Domain command",
  domain_query: "Domain query", domain_service: "Domain service",
  application_service: "Application service", repository: "Repository",
  factory: "Factory", external_integration: "External integration",
};
const TYPE_SHORT = {
  aggregate: "AGG", entity: "ENT", value_object: "VO", domain_event: "EVT",
  domain_command: "CMD", domain_query: "QRY", domain_service: "DS",
  application_service: "AS", repository: "REPO", factory: "FAC",
  external_integration: "EXT",
};
// Hue per block type. Kept as an oklch triple so light and dark themes can
// derive fill / border / text from the same anchor.
const TYPE_HUE = {
  aggregate: 39, entity: 150, value_object: 250, domain_event: 300,
  domain_command: 20, domain_query: 200, domain_service: 100,
  application_service: 70, repository: 330, factory: 175, external_integration: 15,
};
function typeColor(type, kind) {
  const h = TYPE_HUE[type] ?? 90;
  if (kind === "fill") return `oklch(0.94 0.045 ${h})`;
  if (kind === "stroke") return `oklch(0.66 0.13 ${h})`;
  return `oklch(0.42 0.11 ${h})`;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

</script>
<script>
// ---- live-object registry --------------------------------------------------
// Editors bind to the real objects inside DOC, so an edit mutates the document
// in place and any other view re-reads the new value on its next render.
const REFS = [];
function ref(obj) {
  const i = REFS.indexOf(obj);
  return i === -1 ? REFS.push(obj) - 1 : i;
}
function deref(id) {
  return REFS[Number(id)];
}

// ---- editable primitives ---------------------------------------------------
// `editable` renders one field of one object. `lock` mirrors the *_locked flags
// from the schema: a locked field is protected from further AI rewrites, so it
// renders read-only with the lock lit.
function editable(obj, key, opts = {}) {
  const lockKey = opts.lockKey === null ? null : opts.lockKey || `${key}_locked`;
  const locked = lockKey ? !!obj[lockKey] : false;
  const value = obj[key];
  const empty = value === null || value === undefined || value === "";
  const cls = ["ed", opts.class || "", empty ? "is-empty" : "", locked ? "is-locked" : ""].join(" ");
  const text = empty ? "" : esc(value);
  const lockBtn = lockKey
    ? `<button class="lock${locked ? " on" : ""}" data-lock="${ref(obj)}" data-key="${lockKey}" title="${locked ? "Locked — AI will not rewrite this" : "Unlocked — AI may rewrite this"}">${locked ? LOCK_ON : LOCK_OFF}</button>`
    : "";
  return `<span class="field"><span class="${cls}" contenteditable="${locked ? "false" : "plaintext-only"}" data-ref="${ref(obj)}" data-key="${key}" data-placeholder="${esc(opts.placeholder || "empty")}">${text}</span>${lockBtn}</span>`;
}

function enumSelect(obj, key, options, opts = {}) {
  const lockKey = opts.lockKey === null ? null : opts.lockKey || `${key}_locked`;
  const locked = lockKey ? !!obj[lockKey] : false;
  const current = obj[key];
  const opts_ = [`<option value=""${current ? "" : " selected"}>—</option>`]
    .concat(options.map((o) => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(opts.label ? opts.label(o) : o)}</option>`))
    .join("");
  const lockBtn = lockKey
    ? `<button class="lock${locked ? " on" : ""}" data-lock="${ref(obj)}" data-key="${lockKey}">${locked ? LOCK_ON : LOCK_OFF}</button>`
    : "";
  return `<span class="field"><select class="sel" data-ref="${ref(obj)}" data-key="${key}"${locked ? " disabled" : ""}>${opts_}</select>${lockBtn}</span>`;
}

const LOCK_ON = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5H6V4.5a2 2 0 1 1 4 0V6Z"/></svg>`;
const LOCK_OFF = `<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 1 3.5 3.5.75.75 0 0 1-1.5 0 2 2 0 1 0-4 0V6H12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h.5V4.5A3.5 3.5 0 0 1 8 1Z"/></svg>`;

// Wires every editor inside `root`. `onChange(kind)` fires after a value lands,
// so a view can re-render the parts that depend on it (graph labels, counters).
function bindEditors(root, onChange) {
  root.addEventListener("input", (e) => {
    const el = e.target.closest("[data-ref][contenteditable]");
    if (!el) return;
    const obj = deref(el.dataset.ref);
    const text = el.textContent.trim();
    obj[el.dataset.key] = text === "" ? null : text;
    el.classList.toggle("is-empty", text === "");
    onChange && onChange("text", obj, el.dataset.key);
  });
  root.addEventListener("change", (e) => {
    const el = e.target.closest("select[data-ref]");
    if (!el) return;
    const obj = deref(el.dataset.ref);
    obj[el.dataset.key] = el.value === "" ? null : el.value;
    onChange && onChange("select", obj, el.dataset.key);
  });
  root.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-lock]");
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const obj = deref(btn.dataset.lock);
    obj[btn.dataset.key] = !obj[btn.dataset.key];
    onChange && onChange("lock", obj, btn.dataset.key);
  });
  // Enter commits instead of inserting a newline in single-line fields.
  root.addEventListener("keydown", (e) => {
    const el = e.target.closest('[data-ref][contenteditable]:not(.multiline)');
    if (el && e.key === "Enter") {
      e.preventDefault();
      el.blur();
    }
  });
}

// ---- tidy left-to-right tree layout ---------------------------------------
// Nodes are {id, label, children}. Leaves take the next free row, a parent is
// centred on its children. Enough for a design doc's shallow containment tree.
function layoutTree(root, opts = {}) {
  const nodeW = opts.nodeW || 168;
  const nodeH = opts.nodeH || 40;
  const gapX = opts.gapX || 64;
  const gapY = opts.gapY || 14;
  const rowH = nodeH + gapY;
  const placed = [];
  let row = 0;
  function walk(node, depth) {
    const kids = node.children || [];
    let y;
    if (kids.length === 0) {
      y = row * rowH;
      row += 1;
    } else {
      const ys = kids.map((k) => walk(k, depth + 1));
      y = (ys[0] + ys[ys.length - 1]) / 2;
    }
    placed.push({ node, depth, x: depth * (nodeW + gapX), y, w: nodeW, h: nodeH });
    return y;
  }
  walk(root, 0);
  const maxDepth = Math.max(...placed.map((p) => p.depth));
  return {
    nodes: placed,
    width: (maxDepth + 1) * nodeW + maxDepth * gapX,
    height: Math.max(row, 1) * rowH,
    nodeW, nodeH,
  };
}

// Bezier from the right edge of `a` to the left edge of `b`.
function elbow(a, b) {
  const x1 = a.x + a.w;
  const y1 = a.y + a.h / 2;
  const x2 = b.x;
  const y2 = b.y + b.h / 2;
  const mx = (x1 + x2) / 2;
  return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
}

// Arc between two arbitrary boxes, used for dependency edges that skip levels.
function arc(a, b) {
  const ax = a.x + a.w / 2;
  const ay = a.y + a.h / 2;
  const bx = b.x + b.w / 2;
  const by = b.y + b.h / 2;
  const dx = bx - ax;
  const dy = by - ay;
  const bow = Math.min(120, Math.hypot(dx, dy) * 0.35);
  const mx = (ax + bx) / 2 - (dy / (Math.hypot(dx, dy) || 1)) * bow;
  const my = (ay + by) / 2 + (dx / (Math.hypot(dx, dy) || 1)) * bow;
  return `M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`;
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

function changeBadge(change) {
  if (change === "added") return `<span class="badge add">added</span>`;
  if (change === "modified") return `<span class="badge mod">changed</span>`;
  if (change === "removed") return `<span class="badge del">removed</span>`;
  return "";
}

<script>
// ---------------------------------------------------------------------------
// Prototype B — canvas first.
// The building-block graph owns the screen; the document is an inspector on the
// selected node. Contexts are group boxes, modules are labelled bands inside.
// ---------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);

const NODE_W = 178, NODE_H = 56, COL_GAP = 16, ROW_GAP = 14;
const GROUP_PAD = 16, GROUP_HEAD = 32, MOD_HEAD = 20, GROUP_GAP = 54, COLS = 2;

let selName = "Product";
let tab = "overview";
let inspMode = "block";  // "block" | "usecases"
let showDiff = true;
let showDeps = true;
let focusMode = false;  // when on, everything unrelated to the selection fades back
let query = "";
const hiddenTypes = new Set();
const positions = new Map(); // block name -> {x, y}, absolute canvas coords
let view = { x: 40, y: 30, k: 0.85 };
let groups = [];

// ---- layout ----------------------------------------------------------------
function computeLayout() {
  groups = [];
  positions.clear();
  let gx = 0;
  for (const ctx of live(DOC.boundedContexts)) {
    const sections = [];
    const direct = live(ctx.buildingBlocks);
    if (direct.length) sections.push({ title: null, blocks: direct });
    for (const m of live(ctx.modules)) sections.push({ title: m.name, blocks: live(m.buildingBlocks) });
    const gw = GROUP_PAD * 2 + NODE_W * COLS + COL_GAP * (COLS - 1);
    let y = GROUP_HEAD;
    const bands = [];
    for (const s of sections) {
      if (s.title) { bands.push({ title: s.title, y: y + 2 }); y += MOD_HEAD; }
      s.blocks.forEach((b, i) => {
        const col = i % COLS, row = Math.floor(i / COLS);
        positions.set(b.name, { x: gx + GROUP_PAD + col * (NODE_W + COL_GAP), y: y + row * (NODE_H + ROW_GAP) });
      });
      y += Math.ceil(s.blocks.length / COLS) * (NODE_H + ROW_GAP);
    }
    groups.push({ name: ctx.name, ctx, x: gx, y: 0, w: gw, h: y - ROW_GAP + GROUP_PAD + 6, bands });
    gx += gw + GROUP_GAP;
  }
}

function visible(block) {
  if (hiddenTypes.has(block.type)) return false;
  if (query && !block.name.toLowerCase().includes(query)) return false;
  return true;
}

// ---- canvas ----------------------------------------------------------------
function renderCanvas() {
  const index = indexBlocks(DOC).filter((e) => e.block._change !== "removed");
  const byName = new Map(index.map((e) => [e.block.name, e]));
  const edges = showDeps ? blockEdges(DOC) : [];
  const neighbours = new Set();
  for (const e of edges) {
    if (e.from === selName) neighbours.add(e.to);
    if (e.to === selName) neighbours.add(e.from);
  }

  let s = `<defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="var(--grid)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <g id="scene" transform="translate(${view.x},${view.y}) scale(${view.k})">`;

  for (const g of groups) {
    s += `<g data-ctx="${esc(g.name)}">
      <rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="14" fill="color-mix(in oklch, var(--card) 55%, transparent)" stroke="var(--border)" stroke-dasharray="6 5"/>
      <text class="grp-label" x="${g.x + GROUP_PAD}" y="${g.y + 21}">${esc(g.name)}</text>
      ${g.bands.map((b) => `<text class="mod-label" x="${g.x + GROUP_PAD}" y="${b.y + 10}">${esc(b.title)}</text>`).join("")}
    </g>`;
  }

  for (const e of edges) {
    const a = positions.get(e.from), b = positions.get(e.to);
    const ab = byName.get(e.from), bb = byName.get(e.to);
    if (!a || !b || !ab || !bb || !visible(ab.block) || !visible(bb.block)) continue;
    const hot = e.from === selName || e.to === selName;
    const A = { x: a.x, y: a.y, w: NODE_W, h: NODE_H };
    const B = { x: b.x, y: b.y, w: NODE_W, h: NODE_H };
    s += `<path class="link ${e.kind}${hot ? " hot" : focusMode && selName ? " dim" : ""}" marker-end="url(#arrow)" d="${arc(A, B)}"/>`;
  }

  for (const { block, context, module } of index) {
    const p = positions.get(block.name);
    if (!p) continue;
    const vis = visible(block);
    const isSel = block.name === selName;
    const dim = !vis || (focusMode && selName && !isSel && !neighbours.has(block.name));
    const fill = typeColor(block.type, "fill");
    const stroke = typeColor(block.type, "stroke");
    const text = typeColor(block.type, "text");
    const nProps = csCount(block.properties), nBeh = csCount(block.behaviours), nRules = csCount(block.rules);
    const flag = showDiff && block._change === "modified" ? "var(--mod)" : showDiff && block._change === "added" ? "var(--add)" : null;
    const label = block.name.length > 21 ? block.name.slice(0, 20) + "…" : block.name;
    s += `<g class="node${dim ? " dim" : ""}" data-node="${esc(block.name)}" transform="translate(${p.x},${p.y})">
      <rect width="${NODE_W}" height="${NODE_H}" rx="10" fill="${fill}" stroke="${isSel ? "var(--primary)" : stroke}" stroke-width="${isSel ? 2.5 : 1.2}"/>
      <rect width="4" height="${NODE_H}" rx="2" fill="${stroke}"/>
      <text class="n-name" x="14" y="21" fill="${text}">${esc(label)}</text>
      <text class="n-type" x="14" y="34" fill="${text}" opacity="0.7">${esc(TYPE_LABEL[block.type] || "untyped")}</text>
      <text class="n-meta" x="14" y="47" fill="${text}" opacity="0.55">${nProps} props · ${nBeh} beh${useCaseCount(block) ? "" : ` · ${nRules} rules`}</text>
      ${useCaseCount(block) ? `<g transform="translate(${NODE_W - 42},${NODE_H - 19})">
        <rect width="34" height="14" rx="7" fill="var(--primary)"/>
        <text x="17" y="10.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="var(--primary-foreground)">${useCaseCount(block)} UC</text></g>` : ""}
      ${flag ? `<circle cx="${NODE_W - 11}" cy="11" r="4" fill="${flag}"/>` : ""}
    </g>`;
  }
  s += `</g>`;
  $("svg").innerHTML = s;
}

// ---- inspector -------------------------------------------------------------
const TABS = [
  ["overview", "Overview"],
  ["properties", "Properties"],
  ["behaviours", "Behaviours"],
  ["rules", "Rules & scenarios"],
  ["quality", "Quality"],
];

function chipList(cs, linkable) {
  const list = items(cs);
  if (!list.length) return `<span class="muted">—</span>`;
  return `<span class="chips">${list.map((i) => `<span class="chip${linkable ? " link" : ""}"${linkable ? ` data-goto="${esc(i.name)}"` : ""}>${esc(i.name)}</span>`).join("")}</span>`;
}
function badgeOf(i) { return showDiff ? changeBadge(i._change) : ""; }

// Use-case mode: the inspector stops being about one node and lists every entry
// point into the system — public behaviours of application services — grouped by
// actor, with rules and Gherkin scenarios inline.
function renderUseCases() {
  const groups = useCasesByActor(DOC);
  let body = "";
  for (const g of groups) {
    body += `<div class="sec">${esc(g.actor)} · ${g.cases.length}</div>`;
    for (const uc of g.cases) {
      const b = uc.behaviour;
      const scn = items(b.scenarios).filter((s) => s._change !== "removed");
      body += `<div class="item ${showDiff ? b._change : ""}">
        <div class="head"><span class="nm">${editable(b, "name")}</span>${enumSelect(b, "type", BEHAVIOUR_TYPES)}
          <span style="flex:1"></span><span class="chip link" data-goto="${esc(uc.block.name)}">${esc(uc.block.name)}</span>${badgeOf(b)}</div>
        <div class="sub">${editable(b, "description", { class: "multiline", placeholder: "what the actor achieves" })}</div>
        <div class="kv" style="margin-top:6px"><span class="k">Actor</span>${editable(b, "actor", { placeholder: "no actor" })}</div>
        <div class="kv"><span class="k">Input</span>${chipList(b.input)}</div>
        <div class="kv"><span class="k">Output</span>${chipList(b.output)}</div>
        <div class="kv"><span class="k">Uses</span>${chipList(b.usedBuildingBlocks, true)}</div>
        ${items(b.rules).map((r) => `<div class="item ${showDiff ? r._change : ""}"><div class="head"><span class="nm">${editable(r, "name")}</span>${enumSelect(r, "ruleType", RULE_TYPES, { lockKey: null })}</div>
          <div class="sub">${editable(r, "description", { class: "multiline", placeholder: "state the rule" })}</div></div>`).join("")}
        <button class="addbtn" data-add="rule" data-host="${ref(b)}">+ rule</button>
        ${scn.map((s) => `<div class="item ${showDiff ? s._change : ""}"><div class="head"><span class="nm">${editable(s, "name")}</span><span style="flex:1"></span>${badgeOf(s)}</div>
          <div class="gwt"><span class="g">Given</span><span>${editable(s, "given", { class: "multiline" })}</span>
          <span class="g">When</span><span>${editable(s, "when", { class: "multiline" })}</span>
          <span class="g">Then</span><span>${editable(s, "then", { class: "multiline" })}</span></div></div>`).join("")}
        <button class="addbtn" data-add="scenario" data-host="${ref(b)}">+ scenario</button>
      </div>`;
    }
  }
  $("insp").innerHTML = `
    <div class="insp-head">
      <div class="row"><h2>Use cases</h2><span style="flex:1"></span><span class="badge mod">${useCases(DOC).length}</span></div>
      <div class="insp-path">Public behaviours of application services</div>
    </div>
    <div class="insp-body">${body || `<div class="insp-empty">No application service carries a public behaviour yet.</div>`}</div>`;
}

function renderInspector() {
  if (inspMode === "usecases") { renderUseCases(); return; }
  const entry = indexBlocks(DOC).find((e) => e.block.name === selName);
  if (!entry) { $("insp").innerHTML = `<div class="insp-empty">Pick a building block on the canvas.</div>`; return; }
  const b = entry.block;
  const edges = blockEdges(DOC);
  const out = edges.filter((e) => e.from === b.name);
  const inc = edges.filter((e) => e.to === b.name);

  let body = "";
  if (tab === "overview") {
    body += `<div class="kv"><span class="k">Type</span>${enumSelect(b, "type", BLOCK_TYPES, { label: (t) => TYPE_LABEL[t] })}</div>`;
    body += `<div class="kv"><span class="k">Implements</span>${chipList({ added: (b.implements || []).map((n) => ({ name: n })) }, true)}</div>`;
    body += `<div class="sec">Description</div><div class="desc">${editable(b, "description", { class: "multiline", placeholder: "what this block is responsible for" })}</div>`;
    body += `<div class="sec">Outgoing</div>`;
    body += out.length ? out.map((e) => `<div class="item"><div class="head"><span class="badge ${e.kind === "uses" ? "mod" : "add"}">${e.kind}</span><span class="nm chip link" data-goto="${esc(e.to)}">${esc(e.to)}</span></div></div>`).join("") : `<div class="muted">No outgoing relations.</div>`;
    body += `<div class="sec">Incoming</div>`;
    body += inc.length ? inc.map((e) => `<div class="item"><div class="head"><span class="badge ${e.kind === "uses" ? "mod" : "add"}">${e.kind}</span><span class="nm chip link" data-goto="${esc(e.from)}">${esc(e.from)}</span></div></div>`).join("") : `<div class="muted">Nothing depends on this block.</div>`;
  } else if (tab === "properties") {
    for (const p of items(b.properties)) {
      if (p._change === "removed") { body += `<div class="item removed"><div class="head"><span class="nm">${esc(p.name)}</span>${badgeOf(p)}</div></div>`; continue; }
      body += `<div class="item ${showDiff ? p._change : ""}">
        <div class="head"><span class="nm">${editable(p, "name")}</span>
          <span class="chip mono">${editable(p, "type", { placeholder: "type" })}</span>
          <button class="flagbtn${p.nullable ? " on" : ""}" data-flag="${ref(p)}" data-key="nullable">null</button>
          <button class="flagbtn${p.collection ? " on" : ""}" data-flag="${ref(p)}" data-key="collection">list</button>
          <span style="flex:1"></span>${badgeOf(p)}</div>
        <div class="sub">${editable(p, "description", { class: "multiline", placeholder: "describe this property" })}</div></div>`;
    }
    body += `<button class="addbtn" data-add="property" data-host="${ref(b)}">+ property</button>`;
  } else if (tab === "behaviours") {
    for (const beh of items(b.behaviours)) {
      if (beh._change === "removed") { body += `<div class="item removed"><div class="head"><span class="nm">${esc(beh.name)}</span>${badgeOf(beh)}</div></div>`; continue; }
      const isUseCase = b.type === "application_service" && beh.isPublic;
      body += `<div class="item ${showDiff ? beh._change : ""}">
        <div class="head"><span class="nm">${editable(beh, "name")}</span>
          ${isUseCase ? `<span class="badge" style="color:var(--primary);background:color-mix(in oklch, var(--primary) 12%, transparent);border-color:color-mix(in oklch, var(--primary) 30%, transparent)">use case</span>` : ""}
          ${enumSelect(beh, "type", BEHAVIOUR_TYPES)}
          <button class="flagbtn${beh.isPublic ? " on" : ""}" data-flag="${ref(beh)}" data-key="isPublic">public</button>
          <span style="flex:1"></span>${badgeOf(beh)}</div>
        <div class="sub">${editable(beh, "description", { class: "multiline", placeholder: "what it does" })}</div>
        <div class="kv" style="margin-top:6px"><span class="k">Actor</span>${editable(beh, "actor", { placeholder: "no actor" })}</div>
        <div class="kv"><span class="k">Input</span>${chipList(beh.input)}</div>
        <div class="kv"><span class="k">Output</span>${chipList(beh.output)}</div>
        <div class="kv"><span class="k">Uses</span>${chipList(beh.usedBuildingBlocks, true)}</div>
        ${items(beh.rules).map((r) => `<div class="item ${showDiff ? r._change : ""}"><div class="head"><span class="nm">${editable(r, "name")}</span>${enumSelect(r, "ruleType", RULE_TYPES, { lockKey: null })}</div><div class="sub">${editable(r, "description", { class: "multiline", placeholder: "state the rule" })}</div></div>`).join("")}
        ${items(beh.scenarios).map((sc) => `<div class="item ${showDiff ? sc._change : ""}"><div class="head"><span class="nm">${editable(sc, "name")}</span></div>
          <div class="gwt"><span class="g">Given</span><span>${editable(sc, "given", { class: "multiline" })}</span>
          <span class="g">When</span><span>${editable(sc, "when", { class: "multiline" })}</span>
          <span class="g">Then</span><span>${editable(sc, "then", { class: "multiline" })}</span></div></div>`).join("")}
      </div>`;
    }
    body += `<button class="addbtn" data-add="behaviour" data-host="${ref(b)}">+ behaviour</button>`;
  } else if (tab === "rules") {
    body += `<div class="sec">Invariants</div>`;
    for (const r of items(b.rules)) {
      if (r._change === "removed") { body += `<div class="item removed"><div class="head"><span class="nm">${esc(r.name)}</span>${badgeOf(r)}</div></div>`; continue; }
      body += `<div class="item ${showDiff ? r._change : ""}"><div class="head"><span class="nm">${editable(r, "name")}</span>${enumSelect(r, "ruleType", RULE_TYPES, { lockKey: null })}<span style="flex:1"></span>${badgeOf(r)}</div>
        <div class="sub">${editable(r, "description", { class: "multiline", placeholder: "state the rule" })}</div></div>`;
    }
    body += `<button class="addbtn" data-add="rule" data-host="${ref(b)}">+ rule</button>`;
    body += `<div class="sec">Scenarios</div>`;
    for (const sc of items(b.scenarios)) {
      if (sc._change === "removed") { body += `<div class="item removed"><div class="head"><span class="nm">${esc(sc.name)}</span></div></div>`; continue; }
      body += `<div class="item ${showDiff ? sc._change : ""}"><div class="head"><span class="nm">${editable(sc, "name")}</span><span style="flex:1"></span>${badgeOf(sc)}</div>
        <div class="sub">${editable(sc, "description", { class: "multiline", placeholder: "what it shows" })}</div>
        <div class="gwt"><span class="g">Given</span><span>${editable(sc, "given", { class: "multiline" })}</span>
        <span class="g">When</span><span>${editable(sc, "when", { class: "multiline" })}</span>
        <span class="g">Then</span><span>${editable(sc, "then", { class: "multiline" })}</span></div></div>`;
    }
    body += `<button class="addbtn" data-add="scenario" data-host="${ref(b)}">+ scenario</button>`;
  } else {
    const own = items(b.qualityAttributes);
    const inherited = items(ctxOf(entry.context).qualityAttributes);
    for (const q of own) {
      body += `<div class="item ${showDiff ? q._change : ""}"><div class="head"><span class="nm">${editable(q, "name")}</span>${enumSelect(q, "type", QA_TYPES, { lockKey: null })}<span style="flex:1"></span>${badgeOf(q)}</div>
        <div class="sub">${editable(q, "description", { class: "multiline", placeholder: "measurable target" })}</div></div>`;
    }
    if (!own.length) body += `<div class="muted">No quality attributes on this block.</div>`;
    body += `<button class="addbtn" data-add="qa" data-host="${ref(b)}">+ quality attribute</button>`;
    if (inherited.length) {
      body += `<div class="sec">From ${esc(entry.context)}</div>`;
      body += inherited.map((q) => `<div class="item"><div class="head"><span class="nm">${esc(q.name)}</span><span class="chip">${esc(q.type || "other")}</span></div><div class="sub">${esc(q.description || "")}</div></div>`).join("");
    }
  }

  $("insp").innerHTML = `
    <div class="insp-head">
      <div class="row"><span class="tag" style="background:${typeColor(b.type, "fill")};color:${typeColor(b.type, "text")}">${TYPE_SHORT[b.type] || "?"}</span>
        <h2>${editable(b, "name")}</h2><span style="flex:1"></span>${badgeOf(b)}</div>
      <div class="insp-path">${esc(entry.context)}${entry.module ? " › " + esc(entry.module) : ""}</div>
    </div>
    <div class="tabs">${TABS.map(([id, label]) => `<button class="tab${tab === id ? " on" : ""}" data-tab="${id}">${label}</button>`).join("")}</div>
    <div class="insp-body">${body}</div>`;
}

function ctxOf(name) { return live(DOC.boundedContexts).find((c) => c.name === name) || { qualityAttributes: null }; }

// ---- filters + chrome ------------------------------------------------------
function renderFilters() {
  const used = [...new Set(indexBlocks(DOC).map((e) => e.block.type).filter(Boolean))];
  $("filters").innerHTML = `<div class="h">Block types</div>` + used.map((t) =>
    `<div class="fitem${hiddenTypes.has(t) ? " off" : ""}" data-type="${t}"><i style="background:${typeColor(t, "fill")};outline:1px solid ${typeColor(t, "stroke")}"></i>${TYPE_LABEL[t]}</div>`
  ).join("") + `<div class="h" style="margin-top:6px">Relations</div>
    <div class="fitem"><i style="background:oklch(0.6 0.12 300)"></i>implements</div>
    <div class="fitem"><i style="background:oklch(0.62 0.13 250)"></i>uses (behaviour)</div>`;
}

function render() {
  $("topTitle").textContent = DOC.name;
  $("topMeta").textContent = `${DOC.date} · ${indexBlocks(DOC).length} blocks · ${live(DOC.boundedContexts).length} contexts`;
  $("tDiff").classList.toggle("on", showDiff);
  $("tDeps").classList.toggle("on", showDeps);
  $("tFocus").classList.toggle("on", focusMode);
  $("tUse").classList.toggle("on", inspMode === "usecases");
  renderCanvas();
  renderInspector();
  renderFilters();
}

// ---- interaction -----------------------------------------------------------
const svg = $("svg");
let drag = null;

svg.addEventListener("pointerdown", (e) => {
  const node = e.target.closest("[data-node]");
  if (node) {
    const name = node.dataset.node;
    selName = name;
    inspMode = "block";
    const p = positions.get(name);
    drag = { kind: "node", name, sx: e.clientX, sy: e.clientY, ox: p.x, oy: p.y, moved: false };
    node.classList.add("dragging");
    svg.setPointerCapture(e.pointerId);
    render();
    return;
  }
  drag = { kind: "pan", sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
  svg.classList.add("panning");
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.kind === "pan") {
    view.x = drag.ox + dx; view.y = drag.oy + dy;
  } else {
    positions.set(drag.name, { x: drag.ox + dx / view.k, y: drag.oy + dy / view.k });
    drag.moved = true;
  }
  renderCanvas();
});
svg.addEventListener("pointerup", () => { drag = null; svg.classList.remove("panning"); });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k = Math.min(2.2, Math.max(0.25, view.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  renderCanvas();
}, { passive: false });

function fit() {
  const rect = $("wrap").getBoundingClientRect();
  const left = $("filters").getBoundingClientRect().width + 28; // keep clear of the filter panel
  const maxX = Math.max(...groups.map((g) => g.x + g.w));
  const maxY = Math.max(...groups.map((g) => g.y + g.h));
  const k = Math.min((rect.width - left - 40) / maxX, (rect.height - 60) / maxY, 1.4);
  view = { k, x: left + (rect.width - left - 40 - maxX * k) / 2, y: (rect.height - maxY * k) / 2 };
  renderCanvas();
}

const app = $("app");
bindEditors(app, (kind) => { if (kind === "text") renderCanvas(); else render(); });

app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; renderInspector(); return; }
  const goto = e.target.closest("[data-goto]");
  if (goto && positions.has(goto.dataset.goto)) { selName = goto.dataset.goto; inspMode = "block"; render(); return; }
  const f = e.target.closest("[data-type]");
  if (f) { const ty = f.dataset.type; hiddenTypes.has(ty) ? hiddenTypes.delete(ty) : hiddenTypes.add(ty); render(); return; }
  const flag = e.target.closest("[data-flag]");
  if (flag) { const o = deref(flag.dataset.flag); o[flag.dataset.key] = !o[flag.dataset.key]; render(); return; }
  const add = e.target.closest("[data-add]");
  if (add) { addItem(add.dataset.add, deref(add.dataset.host)); return; }
});

$("tDiff").addEventListener("click", () => { showDiff = !showDiff; render(); });
$("tDeps").addEventListener("click", () => { showDeps = !showDeps; render(); });
$("tFocus").addEventListener("click", () => { focusMode = !focusMode; render(); });
$("tUse").addEventListener("click", () => { inspMode = inspMode === "usecases" ? "block" : "usecases"; render(); });
$("tPanel").addEventListener("click", () => {
  const collapsed = $("main").classList.toggle("collapsed");
  $("tPanel").textContent = collapsed ? "show inspector" : "hide inspector";
  requestAnimationFrame(renderCanvas);
});
$("search").addEventListener("input", (e) => { query = e.target.value.toLowerCase(); renderCanvas(); });
$("zIn").addEventListener("click", () => { view.k = Math.min(2.2, view.k * 1.15); renderCanvas(); });
$("zOut").addEventListener("click", () => { view.k = Math.max(0.25, view.k / 1.15); renderCanvas(); });
$("zFit").addEventListener("click", fit);

const EMPTY = () => ({ added: [], modified: [], removed: [] });
function addItem(kind, host) {
  if (kind === "property") (host.properties = host.properties || EMPTY()).added.push({ name: "newProperty", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, nullable: false, collection: false });
  if (kind === "rule") (host.rules = host.rules || EMPTY()).added.push({ name: "New rule", name_locked: false, ruleType: null, description: null, description_locked: false });
  if (kind === "scenario") (host.scenarios = host.scenarios || EMPTY()).added.push({ name: "New scenario", name_locked: false, description: "", description_locked: false, given: "", given_locked: false, when: "", when_locked: false, then: "", then_locked: false });
  if (kind === "qa") (host.qualityAttributes = host.qualityAttributes || EMPTY()).added.push({ name: "New quality attribute", name_locked: false, type: null, description: null, description_locked: false });
  if (kind === "behaviour") (host.behaviours = host.behaviours || EMPTY()).added.push({ name: "NewBehaviour", name_locked: false, type: null, type_locked: false, description: null, description_locked: false, isPublic: false, actor: null, actor_locked: false, input: EMPTY(), output: EMPTY(), usedBuildingBlocks: EMPTY(), rules: EMPTY(), scenarios: EMPTY(), qualityAttributes: EMPTY() });
  render();
}

computeLayout();
render();
requestAnimationFrame(fit);
</script>
