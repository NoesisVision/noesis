# Read by SonarCloud automatic analysis (sonar-project.properties is not).
# The sample repositories under examples/ are foreign code, kept as they are;
# Oxlint, Oxfmt and Knip skip them too. The HTML prototypes beside a plan in
# docs/ are throwaway sketches of a view, not code that ships; Knip skips
# docs prototypes for the same reason.
sonar.exclusions=examples/**,docs/**/*.prototype.html
