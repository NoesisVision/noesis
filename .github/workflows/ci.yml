name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job-level gating (instead of per-workflow `paths:`) so skipped jobs still
  # satisfy required status checks on PRs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            java:
              - 'scanners/java/**'
              - '.github/workflows/ci.yml'
            ts:
              - 'server/**'
              - 'plugins/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.github/workflows/ci.yml'

  # Ungated: format:check (oxfmt) covers **/*.md as well as code, so doc-only
  # commits are still checked.
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: E2E test
        run: bun run test:e2e

      - name: Build
        run: bun run build

  generate-check:
    name: Generated output is committed
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate plugin artifacts
        run: bun run generate

      - name: Verify generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is stale. Run 'bun run generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  java-scanner:
    name: Java scanner build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Matches maven.compiler.release in scanners/java/pom.xml.
          java-version: '17'
          cache: maven
          cache-dependency-path: scanners/java/**/pom.xml

      - name: Build and test
        run: mvn -B --no-transfer-progress verify
        working-directory: scanners/java
