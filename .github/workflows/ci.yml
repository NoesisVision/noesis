name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job-level gating (instead of per-workflow `paths:`) so skipped jobs still
  # satisfy required status checks on PRs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            java:
              - 'scanners/java/**'
              - '.github/workflows/ci.yml'
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'plugins/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'Dockerfile'
              - 'railway.json'
              - '.github/workflows/ci.yml'

  # Ungated: prettier covers **/*.md, so doc-only commits are still checked.
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: E2E test
        run: bun run test:e2e

      - name: Build
        run: bun run build

  generate-check:
    name: Generated output is committed
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate plugin artifacts
        run: bun run generate

      - name: Verify generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is stale. Run 'bun run generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  java-scanner:
    name: Java scanner build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches maven.compiler.release in scanners/java/pom.xml.
          java-version: '17'
          cache: maven
          cache-dependency-path: scanners/java/**/pom.xml

      - name: Build and test
        run: mvn -B --no-transfer-progress verify
        working-directory: scanners/java

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [verify, generate-check]
    # Deploys every green push to main that touched the TS workspace; a
    # java-only push skips verify, which skips this job too. Railway builds
    # the Dockerfile (railway.json); auth is a project token, so no
    # `railway link` is needed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check deploy configuration
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ] || [ -z "${{ vars.RAILWAY_SERVICE }}" ]; then
            echo "::error::Set the RAILWAY_TOKEN secret and the RAILWAY_SERVICE repository variable (Railway service name)."
            exit 1
          fi

      - name: Deploy
        run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

