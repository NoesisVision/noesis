name: Release

# Publishes the MCP bridge and the Claude Code plugin to npm when a v* tag is
# pushed — one version train (decision 33): both packages carry the tag's
# version, bridge first so the plugin's .mcp.json pin resolves the moment the
# plugin lands. Auth is npm trusted publishing (OIDC) — no token secret.
# Provenance is attached automatically. Requires a trusted publisher configured
# on npmjs.com for BOTH @noesis-vision/claude-code-plugin and
# @noesis-vision/mcp-bridge pointing at this repo + workflow file.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Exchanged by npm for short-lived publish credentials (trusted publishing).
  id-token: write

jobs:
  publish:
    name: Publish bridge + plugin to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # bun publish does not support trusted publishing yet (oven-sh/bun#15601),
      # so the tarball is packed with bun (which rewrites workspace:/catalog:
      # specifiers) and published with npm. Trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tags don't trigger the CI workflow, so the full verify suite runs here.
      # `ci` is the same root script developers run locally — one definition
      # of "verified".
      - name: Verify
        run: |
          bun run format:check
          bun run ci

      - name: Verify generated output is committed
        run: |
          bun run generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is stale. Run 'bun run generate' and commit before tagging."
            git status --porcelain
            exit 1
          fi

      - name: Verify tag matches package versions
        id: version
        run: |
          VERSION=$(node -p 'require("./plugins/claude-code/package.json").version')
          BRIDGE_VERSION=$(node -p 'require("./plugins/mcp-bridge/package.json").version')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $VERSION."
            exit 1
          fi
          if [ "$BRIDGE_VERSION" != "$VERSION" ]; then
            echo "::error::Bridge version $BRIDGE_VERSION does not match plugin version $VERSION (one version train)."
            exit 1
          fi
          # Prereleases go to the beta dist-tag, stable releases to latest.
          case "$VERSION" in
            *-*) echo "dist-tag=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pack bridge
        working-directory: plugins/mcp-bridge
        run: |
          bun run build
          bun pm pack

      - name: Pack plugin
        working-directory: plugins/claude-code
        run: bun pm pack

      # Bridge first: the plugin's .mcp.json pins this exact bridge version, so
      # a plugin without its bridge must never be the published state.
      - name: Publish bridge
        working-directory: plugins/mcp-bridge
        run: npm publish ./*.tgz --tag "${{ steps.version.outputs.dist-tag }}" --access public

      - name: Publish plugin
        working-directory: plugins/claude-code
        run: npm publish ./*.tgz --tag "${{ steps.version.outputs.dist-tag }}" --access public
