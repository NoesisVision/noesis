# A repository's scan command on a reactor that does not fully compile: a compile error does not fail the build
# (maven.compiler.failOnError=false), so the module is scanned with the compiler's errors in its model, and the
# modules after it are scanned too.
invoker.goals = -q -Dmaven.compiler.failOnError=false process-classes vision.noesis:noesis-scanner-maven-plugin:${project.version}:scan -Dnoesis.out=target/noesis -Dnoesis.repository=broken-reactor
